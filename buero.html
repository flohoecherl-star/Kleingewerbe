<title>Garten Flo · Büro</title>
<meta name="theme-color" content="#0d1310">

<style>
:root{
  --bg:#0e1512; --surface:#18211c; --surface2:#202b24; --line:#2c3b32;
  --txt:#eaf2ec; --mut:#95ac9e; --dim:#6b8272;
  --moss:#63cf88; --moss-d:#2f7a4c; --clay:#e6ab63; --red:#e8756b; --blue:#78b0e0;
  --r:16px;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 10px 26px -16px rgba(0,0,0,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 50% -180px,#16241c 0%,var(--bg) 60%) no-repeat,var(--bg);
  color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  padding-bottom:calc(82px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.4px}
a{color:var(--moss)}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0e1512 62%,rgba(14,21,18,.86) 86%,rgba(14,21,18,0));backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 0 12px}
header.top .wrap{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--moss),var(--moss-d));display:grid;place-items:center;font-weight:700;color:#06210f;font-family:'Barlow Condensed';font-size:20px}
img.logo{background:none;border-radius:0;object-fit:contain;display:block;width:38px;height:38px}
.ttl{font-size:22px;font-weight:600;text-transform:uppercase;line-height:1;letter-spacing:.8px}
.sub{font-size:10.5px;color:var(--dim);letter-spacing:2.2px;text-transform:uppercase}
.card{background:linear-gradient(180deg,#1a231d,#161f1a);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.tight{padding:11px 14px}
.lbl{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:600}
.big{font-family:'Barlow Condensed';font-size:40px;font-weight:700;line-height:1.05;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mono{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:15px}
.btn{background:var(--surface2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:transform .12s,background .15s,border-color .15s}
.btn:active{transform:scale(.975)}
.btn:hover{border-color:#3a4d41}
.btn.pri{background:linear-gradient(180deg,#6fd894,#48b371);color:#06210f;border-color:transparent;box-shadow:0 8px 18px -10px rgba(99,207,136,.9)}
.btn.pri:hover{border-color:transparent;filter:brightness(1.04)}
.btn.dan{color:var(--red);border-color:#43302e}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
input,select,textarea{width:100%;background:#111a16;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 12px;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--moss-d);background:#0f1714}
textarea{resize:vertical;min-height:70px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-bottom:5px;font-weight:600}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(16,24,20,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;color:var(--dim);padding:10px 2px 11px;font-size:10.5px;font-weight:600;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;transition:color .15s}
.tabbar button.on{color:var(--moss)}
.tabbar button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--moss)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3.5px 9px;border-radius:99px;white-space:nowrap;display:inline-block;margin-top:3px}
.p-offen{background:#1d2c3a;color:var(--blue)}
.p-bezahlt{background:#17301f;color:var(--moss)}
.p-faellig{background:#3a2220;color:var(--red)}
.p-teil{background:#33291a;color:var(--clay)}
.p-entwurf{background:#242f28;color:var(--mut)}
.p-angenommen{background:#17301f;color:var(--moss)}
.p-abgelehnt{background:#2a2422;color:var(--dim)}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:opacity .15s}
.item:active{opacity:.6}
.item:last-child{border-bottom:0}
.item .g{flex:1;min-width:0}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mt{font-size:12.5px;color:var(--mut)}
.amt{font-family:'Barlow Condensed';font-size:21px;font-weight:600;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding-bottom:40px;animation:up .18s ease}
@keyframes up{from{transform:translateY(14px);opacity:.4}}
.sheet header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;z-index:5}
.sheet .body{padding:14px;max-width:820px;margin:0 auto}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 10px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--moss);color:#06210f;box-shadow:0 4px 12px -6px rgba(99,207,136,.9)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--moss);border-radius:99px}
.chart{width:100%;height:150px}
.pos{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.pos .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.hint{font-size:12.5px;color:var(--mut)}
.warn{background:#2e2618;border:1px solid #4a3c20;color:#f0c987;border-radius:13px;padding:12px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.55}
.info{background:#16232c;border:1px solid #253d4a;color:#aed2e6;border-radius:13px;padding:12px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.55}
.empty{text-align:center;color:var(--dim);padding:34px 10px;font-size:14px;line-height:1.6}
.greet{font-family:'Barlow Condensed';font-size:23px;font-weight:600;letter-spacing:.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--moss);color:#06210f;font-weight:600;padding:10px 18px;border-radius:99px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(94px + env(safe-area-inset-bottom));z-index:45;width:58px;height:58px;border-radius:21px;background:linear-gradient(160deg,#79dd9d,#3fa268);color:#06210f;border:0;font-size:31px;font-weight:300;line-height:1;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(63,162,104,.75),0 4px 10px rgba(0,0,0,.35);cursor:pointer;transition:transform .12s}
.fab:active{transform:scale(.94)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th{text-align:left;color:var(--mut);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:5px 4px;border-bottom:1px solid var(--line)}
table.mini td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.mini td.n{text-align:right;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Monats-/Jahresgruppen ---------- */
.ygroup{margin-bottom:16px}
.yhead{display:flex;align-items:baseline;gap:9px;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.yhead .yy{font-family:'Barlow Condensed';font-size:27px;font-weight:700;letter-spacing:1px;line-height:1}
.mgroup{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
.mgroup>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:9px;background:var(--surface2)}
.mgroup>summary::-webkit-details-marker{display:none}
.mgroup>summary .car{color:var(--dim);font-size:15px;transition:transform .15s;display:inline-block}
.mgroup[open]>summary .car{transform:rotate(90deg)}
.mgroup>summary .mn{font-family:'Barlow Condensed';font-size:18px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.mgroup>summary .cnt{flex:1;font-size:11.5px;color:var(--mut)}
.mgroup .inner{padding:0 12px}
.tag{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.t-sofort{background:#17301f;color:var(--moss)}
.t-gwg{background:#1d2c3a;color:var(--blue)}
.t-anlage{background:#33291a;color:var(--clay)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chips button{background:var(--surface2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--moss);color:#06210f;border-color:var(--moss)}

/* ---------- Druckansicht (A4) ---------- */
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  @page{size:A4;margin:14mm 16mm 12mm 20mm}
}
#print{font-family:Inter,Arial,sans-serif;color:#1a1a1a;font-size:10pt;line-height:1.45}
#print .ph{display:flex;justify-content:flex-end;margin-bottom:14mm}
#print .brand{text-align:right;font-family:'Barlow Condensed',Arial;line-height:1}
#print .brand .b1{font-size:26pt;color:#5a9e46;font-weight:600}
#print .brand .b2{font-size:9pt;letter-spacing:5px;color:#7d9a72}
#print .brand img{max-height:22mm}
#print .addr{display:flex;justify-content:space-between;gap:12mm}
#print .sender{font-size:6.8pt;color:#444;border-bottom:.4pt solid #999;padding-bottom:1mm;margin-bottom:2.5mm}
#print .meta{width:74mm;font-size:9pt}
#print .meta .h{display:flex;justify-content:space-between;font-size:13pt;font-weight:600;margin-bottom:2mm}
#print .meta .l{display:flex;justify-content:space-between;color:#333}
#print h1{font-size:14pt;margin:16mm 0 6mm;font-family:Inter,Arial;font-weight:700}
#print table{width:100%;border-collapse:collapse;margin-top:5mm}
#print th{font-size:9pt;text-align:right;padding:2mm 1.5mm;border-bottom:.6pt solid #333}
#print th:nth-child(1),#print th:nth-child(2){text-align:left}
#print td{padding:2.2mm 1.5mm;text-align:right;vertical-align:top;font-size:9.5pt}
#print td:nth-child(1),#print td:nth-child(2){text-align:left}
#print td:nth-child(2){font-weight:600}
#print tr.sum td{background:#f1f1f1;font-size:9.5pt}
#print tr.sum.b td{font-weight:700}
#print .foot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6mm;font-size:6.6pt;color:#555;border-top:.4pt solid #ccc;padding-top:2mm}
#print .foot div{flex:1}
#print .pay{margin-top:8mm;font-size:9.5pt}
</style>
</head>

const custName=c=>((c.company||`${c.first||''} ${c.last||''}`.trim()||c.name||'\u2014'));
function migCustomer(c){
  if(c.first===undefined&&c.last===undefined){
    const nm=(c.name||'').trim();
    if(c.anrede==='Firma'){c.company=nm;c.first='';c.last='';c.anrede='';}
    else{const p=nm.split(/\s+/).filter(Boolean);c.last=p.length>1?p.pop():(p[0]||'');c.first=p.join(' ');}
  }
  c.company=c.company||'';c.first=c.first||'';c.last=c.last||'';
  c.name=custName(c);return c;
}
const addrLines=c=>[c.company,`${c.first||''} ${c.last||''}`.trim(),c.street,`${c.zip||''} ${c.city||''}`.trim(),c.country].filter(x=>x&&String(x).trim());
const sortName=c=>((c.last||c.company||c.name||'')+' '+(c.first||'')).toLowerCase();

const RX_GERAET=/(m\u00e4her|maeher|motorsense|freischneider|kettens\u00e4ge|kettensaege|motors\u00e4ge|h\u00e4cksler|haecksler|vertikutier|laubbl\u00e4ser|laubblaeser|laubsauger|heckenschere|heckentrimmer|hochdruckreiniger|schubkarre|anh\u00e4nger|anhaenger|leiter|akkuschrauber|bohrmaschine|schleifer|generator|stromerzeuger|pumpe|maschine|ger\u00e4t|geraet|werkbank|regal|schrank|schreibtisch|handy|iphone|smartphone|laptop|notebook|tablet|drucker|computer|monitor|k\u00e4rcher|karcher|stihl|husqvarna|makita|gardena)/i;
const RX_VERBRAUCH=/(mulch|erde|substrat|kompost|d\u00fcnger|duenger|pflanz|staude|samen|saatgut|rasensamen|rollrasen|kies|splitt|sand|vlies|folie|schrauben|n\u00e4gel|naegel|kabelbinder|benzin|diesel|sprit|tanken|treibstoff|kraftstoff|\u00f6l|oel|kettens\u00e4gen\u00f6l|m\u00e4hfaden|maehfaden|trimmerfaden|s\u00e4gekette|saegekette|schneidmesser|handschuh|m\u00fcllsack|muellsack|entsorgung|gr\u00fcnschnitt|gruenschnitt|deponie|wertstoffhof|verbrauch|ersatzteil|filter|z\u00fcndkerze)/i;
const ND_RX=[
 [/(handy|iphone|smartphone|laptop|notebook|tablet|computer|monitor|drucker|software)/i,1],
 [/(motorsense|freischneider|kettens\u00e4ge|kettensaege|motors\u00e4ge|laubbl\u00e4ser|laubblaeser|heckenschere|akkuschrauber|bohrmaschine|hochdruckreiniger|schleifer)/i,7],
 [/(rasenm\u00e4her|m\u00e4her|maeher|vertikutier)/i,7],
 [/(h\u00e4cksler|haecksler|aufsitzm\u00e4her|anh\u00e4nger|anhaenger)/i,8],
 [/(transporter|pkw|auto|fahrzeug|pritsche|anh\u00e4ngerkupplung)/i,6],
 [/(schrank|regal|schreibtisch|b\u00fcrom\u00f6bel|werkbank)/i,13]
];
const ndFor=t=>{for(const r of ND_RX)if(r[0].test(String(t||'')))return r[1];return 8;};
const netOf=e=>(+e.amount||0)/(1+((e.vat===undefined?19:+e.vat)||0)/100);
function classify(e){
  const t=((e.desc||'')+' '+(e.vendor||'')+' '+(e.category||'')).toLowerCase();
  const net=netOf(e);
  if(e.category==='Fahrtkosten (km)'||(+e.km||0)>0)return 'betrieb';
  const geraet=RX_GERAET.test(t)||e.category==='Werkzeug & Maschinen';
  if(geraet&&!RX_VERBRAUCH.test(t)){
    if(net<=POOL_MIN)return 'verbrauch';
    if(net<=GWG_LIMIT)return 'gwg';
    return 'anlage';
  }
  if(RX_VERBRAUCH.test(t)||['Material & Pflanzen','Entsorgung','Fahrzeug & Sprit','Arbeitskleidung'].includes(e.category))return 'verbrauch';
  return 'betrieb';
}
/* Anlagegut automatisch anlegen / pflegen, wenn eine Ausgabe aktiviert wird */
function linkAsset(e,store){
  /* §9b EStG: nicht abziehbare Vorsteuer gehört zu den Anschaffungskosten.
     Als Kleinunternehmer schreibst du also den Bruttobetrag ab —
     die 800-€-Grenze für GWG wird trotzdem am Nettowert gemessen. */
  const klein=store.settings&&store.settings.defaults?store.settings.defaults.klein:true;
  const net=+(klein?(+e.amount||0):netOf(e)).toFixed(2);
  const a0=e.assetId?store.assets.find(a=>a.id===e.assetId):null;
  if(a0){if(a0.fromExpense===e.id){a0.name=e.desc||a0.name;a0.date=e.date;a0.cost=net;}return;}
  const ex=store.assets.find(a=>a.date===e.date&&Math.abs((+a.cost||0)-net)<1.5);
  if(ex){e.assetId=ex.id;return;}
  const a={id:uid(),name:e.desc||'Anlagegut',date:e.date,cost:net,years:ndFor((e.desc||'')+' '+(e.vendor||'')),
    type:(e.date>='2025-07-01'&&e.date<='2027-12-31')?'degressiv':'afa',sonder:false,
    note:(e.vendor?e.vendor+' \u00b7 ':'')+'aus Ausgabe \u00fcbernommen',fromExpense:e.id};
  store.assets.push(a);e.assetId=a.id;
}
function unlinkAsset(e){
  if(!e.assetId)return;
  const i=db.assets.findIndex(a=>a.id===e.assetId&&a.fromExpense===e.id);

  delete e.assetId;
}

function totals(d){
  const net=sum(d.positions||[],p=>(+p.qty||0)*(+p.price||0));
  const vat=d.klein?0:net*((+d.vat||0)/100);

function paid(d){return sum(d.payments||[],p=>+p.amount||0);}
function statusOf(d){
  if(d.draft)return'entwurf';
  const t=totals(d).gross,p=paid(d);
  if(t<0)return p<=t+0.005?'bezahlt':'offen';           // Stornorechnung
  if(p>=t-0.005&&t>0)return'bezahlt';
  if(p>0)return'teilbezahlt';
  if(d.dueDate&&d.dueDate<today())return'faellig';
  return'offen';
}

const DEG_FROM='2025-07-01',DEG_TO='2027-12-31';
const degAllowed=d=>d>=DEG_FROM&&d<=DEG_TO;
const _planCache=new Map();
function afaPlan(a){
  const key=JSON.stringify([a.date,a.cost,a.years,a.type,a.sonder]);
  if(_planCache.has(key))return _planCache.get(key);
  const plan={},buyY=+a.date.slice(0,4),buyM=+a.date.slice(5,7),cost=+a.cost||0;
  const add=(y,v)=>{if(v>0.004)plan[y]=(plan[y]||0)+v;};
  if(a.type==='gwg')add(buyY,cost);
  else if(a.type==='pool'){for(let k=0;k<5;k++)add(buyY+k,cost/5);}
  else{
    const nd=Math.max(1,+a.years||5);
    const rate=a.type==='degressiv'?Math.min(0.3,3/nd):0;
    let rest=cost,remaining=nd;
    for(let y=buyY;rest>0.005&&y<buyY+nd+3;y++){
      const f=y===buyY?(13-buyM)/12:1;
      const deg=rest*rate*f, lin=remaining>0?rest/remaining*f:rest;
      let v=Math.max(deg,lin);
      if(y===buyY&&a.sonder)v+=cost*0.4;
      v=Math.min(v,rest);
      add(y,v);rest-=v;remaining-=f;
      if(remaining<=0.01&&rest>0.005){add(y,rest);rest=0;}
    }
  }
  _planCache.set(key,plan);return plan;
}
const afaYear=(a,y)=>afaPlan(a)[y]||0;
function bookValue(a,y){let s=0;const p=afaPlan(a);Object.keys(p).forEach(k=>{if(+k<=y)s+=p[k];});return Math.max(0,(+a.cost||0)-s);}

const iabYear=y=>sum(db.iab.filter(i=>+i.year===y),i=>+i.amount||0)-sum(db.iab.filter(i=>+i.resolvedYear===y),i=>+i.amount||0);

    <div style="text-align:right"><div class="amt mono">${eur(t)}</div>${pill(s)}</div></div>`;

/* ---------- Gruppierung nach Jahr und Monat ---------- */
const yearsOf=arr=>[...new Set(arr.map(x=>String(x.date||'').slice(0,4)).filter(y=>y.length===4))].sort().reverse();
function chips(values,current,setter,labels){
  return `<div class="chips">${values.map(v=>
    `<button class="${String(current)===String(v)?'on':''}" onclick="${setter}('${v}')">${labels&&labels[v]?labels[v]:v}</button>`).join('')}</div>`;
}
function byYearMonth(list){
  const o={};
  list.forEach(x=>{const d=String(x.date||'');if(d.length<7)return;
    const y=d.slice(0,4),m=d.slice(5,7);(o[y]=o[y]||{});(o[y][m]=o[y][m]||[]).push(x);});
  return o;
}
function periodView(list,rowFn,sumFn,label,extraFn){
  const g=byYearMonth(list),cur=today().slice(0,7);
  const ys=Object.keys(g).sort().reverse();
  if(!ys.length)return '';
  return ys.map(y=>{
    const ms=Object.keys(g[y]).sort().reverse();
    const all=ms.reduce((a,m)=>a.concat(g[y][m]),[]);
    return `<div class="ygroup">
      <div class="yhead"><span class="yy">${y}</span><span class="hint">${all.length} ${label}</span>
        <span style="flex:1"></span><b class="amt mono">${eur(sumFn(all))}</b></div>
      ${extraFn?extraFn(y,all):''}
      ${ms.map(m=>{const it=g[y][m];
        return `<details class="mgroup" ${(y+'-'+m)===cur?'open':''}><summary>
          <span class="car">›</span><span class="mn">${MONTHS[+m-1]}</span>
          <span class="cnt">${it.length}</span><b class="amt mono">${eur(sumFn(it))}</b></summary>
          <div class="inner">${it.map(rowFn).join('')}</div></details>`;}).join('')}
    </div>`;}).join('');
}

    <tr><th>Monat</th><th class="n" style="text-align:right">Einnahmen</th><th class="n" style="text-align:right">Ausgaben</th><th class="n" style="text-align:right">Ergebnis</th></tr>
    ${rows.map(r=>`<tr style="${r.ein||r.aus?'':'opacity:.4'}"><td>${r.mn.slice(0,3)}</td>
      <td class="n">${r.ein?nf.format(r.ein):'–'}</td>
      <td class="n">${r.aus?nf.format(r.aus):'–'}</td>
      <td class="n" style="color:${r.ein-r.aus>=0?'var(--moss)':'var(--red)'}">${r.ein||r.aus?nf.format(r.ein-r.aus):'–'}</td></tr>`).join('')}
    <tr><td><b>Summe</b></td><td class="n"><b>${nf.format(tE)}</b></td><td class="n"><b>${nf.format(tA)}</b></td>
      <td class="n"><b>${nf.format(tE-tA)}</b></td></tr>
  </table>
  <div class="hint" style="margin-top:6px">Einnahmen nach Zahlungseingang, Ausgaben ohne aktivierte Anschaffungen (die laufen über die AfA).</div>`;
}

function numberGaps(){
  const p=db.settings.numbers.invPrefix,y=new Date().getFullYear();
  const ns=[...new Set(db.invoices.filter(i=>!i.draft&&i.number.startsWith(p)&&+i.date.slice(0,4)>=y-1)
    .map(i=>+i.number.slice(p.length)).filter(n=>!isNaN(n)))].sort((a,b)=>a-b);
  const g=[];
  for(let i=1;i<ns.length&&g.length<12;i++)for(let k=ns[i-1]+1;k<ns[i]&&g.length<12;k++)g.push(p+k);
  return g;
}
function numberDupes(){
  const c={};db.invoices.forEach(i=>{if(!i.draft)c[i.number]=(c[i.number]||0)+1;});
  return Object.keys(c).filter(k=>c[k]>1);
}

function pullTimes(){
  const open=db.times.filter(x=>!x.invoiceId&&x.customerId===cur.customerId);
  open.forEach(t=>{cur.positions.push({desc:(t.desc||'Gartenarbeit')+' ('+dDE(t.date)+')',qty:+t.hours||0,unit:'Std',price:+t.rate||db.settings.defaults.hourRate});
    t._pull=cur.id;});
  cur._pulledTimes=open.map(t=>t.id);drawEditor();
}
function saveDoc(draft){
  if(!cur.customerId){toast('Bitte Kunde wählen');return;}
  if(!cur.positions.length){toast('Mindestens eine Position');return;}
  cur.draft=draft;
  const arr=curType==='invoice'?db.invoices:db.offers;
  const i=arr.findIndex(d=>d.id===cur.id);
  const wasNew=cur._new;delete cur._new;
  if(cur._pulledTimes){cur._pulledTimes.forEach(id=>{const t=db.times.find(x=>x.id===id);if(t)t.invoiceId=cur.id;});delete cur._pulledTimes;}
  if(i>=0)arr[i]=cur;else arr.push(cur);
  if(wasNew&&!draft){if(curType==='invoice')db.settings.numbers.invNext++;else db.settings.numbers.offNext++;}
  save();closeSheets();render();toast(draft?'Entwurf gesichert':'Gesichert');
}

function delPay(id,i){const d=db.invoices.find(x=>x.id===id);d.payments.splice(i,1);save();closeSheets();render();}

/* ---------- Serienrechnungen ---------- */
function recurringDue(){return db.invoices.filter(i=>i.recurring&&i.recurring.next<=today());}
function createRecurring(){
  const s=db.settings;let n=0;
  recurringDue().forEach(src=>{
    const inv={...structuredClone(src),id:uid(),number:s.numbers.invPrefix+s.numbers.invNext,date:today(),
      deliveryDate:today(),dueDate:addDays(today(),s.defaults.paymentDays),payments:[],draft:false,recurring:null};
    db.invoices.push(inv);s.numbers.invNext++;n++;
    const step={monat:30,quartal:91,jahr:365}[src.recurring.every];
    src.recurring.next=addDays(src.recurring.next,step);
  });
  save();render();toast(n+' Rechnung(en) erstellt');
}

/* ---------- E-Mail ---------- */
function anredeOf(c){
  const last=(c.last||'').trim()||(c.name||'').trim().split(/\s+/).pop();
  if(c.anrede==='Herr')return 'Sehr geehrter Herr '+last+',';
  if(c.anrede==='Frau')return 'Sehr geehrte Frau '+last+',';
  return 'Sehr geehrte Damen und Herren,';
}
function fillTpl(s,d,type){
  const c=cust(d.customerId),co=db.settings.company,t=totals(d);
  const pos=d.positions.map(p=>`• ${p.desc}: ${nf.format(p.qty)} ${p.unit} × ${eur(p.price)} = ${eur(p.qty*p.price)}`).join('\n');
  return s.replace(/{(\w+)}/g,(m,k)=>({
    anrede:anredeOf(c),
    nummer:d.number,datum:dDE(d.date),betrag:eur(t.gross),offen:eur(t.gross-paid(d)),faellig:dDE(d.dueDate),
    kunde:c.name,firma:co.name,inhaber:co.owner,iban:co.iban,bic:co.bic,telefon:co.phone,email:co.email,
    positionen:pos,leistungsdatum:dDE(d.deliveryDate)
  }[k]??m));
}
function mailDoc(type,id,kind){
  const d=(type==='invoice'?db.invoices:db.offers).find(x=>x.id===id);
  const m=db.settings.mail,c=cust(d.customerId);
  const sub=fillTpl(kind==='inv'?m.invSubject:kind==='off'?m.offSubject:m.remSubject,d);
  const body=fillTpl(kind==='inv'?m.invBody:kind==='off'?m.offBody:m.remBody,d);
  const kindName=kind==='rem'?'Zahlungserinnerung':(type==='invoice'?'Rechnung':'Angebot');
  sheet('E-Mail',`
  <div class="card">
    <label class="f"><span>An</span><input id="m_to" value="${esc(c.email||'')}" inputmode="email"></label>
    <label class="f"><span>Betreff</span><input id="m_sub" value="${esc(sub)}"></label>
    <label class="f"><span>Text</span><textarea id="m_body" style="min-height:260px">${esc(body)}</textarea></label>
  </div>
  <button class="btn pri full" id="m_share">Senden — PDF im Anhang</button>
  <div class="hint" style="margin:8px 0">Öffnet das Teilen-Menü mit fertigem PDF. Dort <b>Mail</b> wählen — die Nachricht geht mit Anhang, Betreff und Text auf. Text ist zusätzlich in der Zwischenablage, falls Mail ihn nicht automatisch übernimmt.</div>
  <div class="grid2">
    <button class="btn" id="m_pdf">Nur PDF speichern</button>
    <button class="btn" id="m_mailto">Nur Text-Mail</button>
  </div>`);
  const q=x=>document.querySelector(x);
  q('#m_share').onclick=async()=>{
    const subject=q('#m_sub').value,text=q('#m_body').value;
    try{await navigator.clipboard.writeText(text);}catch(e){}
    const doc=await genPdf(type,id,kindName);
    if(!doc){toast('PDF-Modul nicht geladen — bitte online öffnen');return;}
    const fname=pdfName(d,c);
    const file=new File([doc.output('blob')],fname,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:subject,text:text});}catch(e){}
    }else{
      doc.save(fname);
      location.href=`mailto:${q('#m_to').value}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
      toast('PDF gespeichert — bitte in der Mail anhängen');
    }
  };
  q('#m_pdf').onclick=()=>downloadPdf(type,id,kindName);
  q('#m_mailto').onclick=()=>{
    location.href=`mailto:${q('#m_to').value}?subject=${encodeURIComponent(q('#m_sub').value)}&body=${encodeURIComponent(q('#m_body').value)}`;};
}
function editMail(){
  const m=structuredClone(db.settings.mail);

    else if(k==='verbrauch'&&net>GWG_LIMIT)extra=`<div class="hint" style="margin-top:6px">Über ${GWG_LIMIT} € netto: falls das doch ein Gerät ist, stell oben auf „Anlagegut" um.</div>`;
    g('#e_hint').innerHTML=`<div class="info" style="margin:10px 0 0">

function delExpense(id){
  const i=db.expenses.findIndex(e=>e.id===id);

function shrink(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',q));};img.src=r.result;};r.readAsDataURL(file);});}

function pdfName(d,c){return d.number.replace(/[^\w-]/g,'')+'_'+(c.name||'Kunde').replace(/[^\wäöüÄÖÜß]+/g,'_')+'.pdf';}
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
async function genPdf(type,id,kind){
  if(!window.jspdf)return null;
  const {jsPDF}=window.jspdf;
  const d=(type==='invoice'?db.invoices:db.offers).find(x=>x.id===id);
  const c=cust(d.customerId),co=db.settings.company,t=totals(d),isInv=type==='invoice';
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const L=20,R=194,W=R-L;
  const money=v=>nf.format(v)+' EUR';
  /* Logo über Canvas auf weißen Grund rendern – jsPDF bekommt so immer ein sauberes JPEG */
  let logoData=null,logoAR=2.7;
  {
    const li=await loadImg(logoSrc());
    if(li&&li.width){
      try{
        const cv=document.createElement('canvas');
        cv.width=li.naturalWidth||li.width;cv.height=li.naturalHeight||li.height;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
        ctx.drawImage(li,0,0,cv.width,cv.height);
        logoData=cv.toDataURL('image/jpeg',0.94);
        logoAR=cv.width/cv.height;
      }catch(err){logoData=null;}
    }
  }

  const header=()=>{
    if(logoData){
      const h=17,w=h*logoAR;
      doc.addImage(logoData,'JPEG',R-w,11,w,h);
    }else{
      doc.setTextColor(90,158,70);doc.setFont('helvetica','bold');doc.setFontSize(22);
      doc.text(co.name,R,22,{align:'right'});
      doc.setTextColor(125,154,114);doc.setFont('helvetica','normal');doc.setFontSize(8);
      doc.text(co.claim||'',R,27.5,{align:'right',charSpace:1.4});
    }
  };
  const footer=(page,pages)=>{
    doc.setFontSize(7);doc.setTextColor(60);
    doc.text(page+'/'+pages,R,265,{align:'right'});
    doc.setDrawColor(190);doc.setLineWidth(.15);doc.line(L,269,R,269);
    doc.setFontSize(6.6);doc.setTextColor(85);
    const cols=[
      [co.name,co.street,co.zip+' '+co.city,co.country],
      ['Tel. '+co.phone,'E-Mail '+co.email],
      ['Steuer-Nr. '+co.taxNumber,'Inhaber/-in '+co.owner],
      ['Bank '+co.bankName,'IBAN '+co.iban,'BIC '+co.bic]
    ];
    cols.forEach((cl,i)=>cl.forEach((line,k)=>doc.text(String(line||''),L+i*44,272.5+k*3)));
  };

  header();
  // Absenderzeile + Empfänger
  doc.setFontSize(6.8);doc.setTextColor(68);doc.setFont('helvetica','normal');
  doc.text(co.name+'  -  '+co.street+'  -  '+co.zip+' '+co.city,L,60);
  doc.setDrawColor(150);doc.setLineWidth(.1);doc.line(L,61.4,L+78,61.4);
  doc.setFontSize(10.5);doc.setTextColor(20);
  addrLines(c).forEach((x,i)=>doc.text(String(x||''),L,68+i*5));

  // Meta-Block rechts
  const MX=122;
  doc.setFont('helvetica','bold');doc.setFontSize(12);
  doc.text(isInv?'Rechnungs-Nr.':'Angebots-Nr.',MX,62);doc.text(d.number,R,62,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(45);
  const meta=[
    [isInv?'Rechnungsdatum':'Angebotsdatum',dDE(d.date)],
    [isInv?'Lieferdatum':'Gültig bis',dDE(isInv?d.deliveryDate:d.dueDate)],
    null,
    ['Ihre Kundennummer',String(c.number||'')],
    ['Ihr Ansprechpartner',co.owner]
  ];
  let my=68;
  meta.forEach(m=>{if(!m){my+=2.5;return;}doc.text(m[0],MX,my);doc.text(m[1],R,my,{align:'right'});my+=4.4;});

  // Titel + Einleitung
  doc.setTextColor(20);doc.setFont('helvetica','bold');doc.setFontSize(12.5);
  const title=kind==='Rechnung'?'Rechnungs Nr. '+d.number:kind+' Nr. '+d.number;
  doc.text(title,L,102);
  const mahnText=kind==='Zahlungserinnerung'
    ? 'sicher ist es Ihrer Aufmerksamkeit entgangen: die unten aufgeführte Rechnung ist seit dem '+dDE(d.dueDate)+' fällig und noch offen.\nBitte überweisen Sie den Betrag in den nächsten Tagen. Sollten Sie bereits gezahlt haben, betrachten Sie dieses Schreiben als gegenstandslos.'

  const payLines=isInv

  py+=7;
  doc.text('Mit freundlichen Grüßen',L,py);py+=5;
  doc.text(co.owner,L,py);

  // Girocode (EPC-QR) rechts neben Zahlungstext
  if(isInv&&co.iban&&window.qrcode&&openAmt>0){
    try{
      const payload=['BCD','002','1','SCT',(co.bic||'').replace(/\s/g,''),co.name,
        co.iban.replace(/\s/g,''),'EUR'+openAmt.toFixed(2),'','',d.number].join('\n');
      const qr=qrcode(0,'M');qr.addData(payload);qr.make();
      const n=qr.getModuleCount(),size=26,cell=size/n,qx=R-size,qy=y;
      doc.setFillColor(0,0,0);
      for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(qr.isDark(r,cc))doc.rect(qx+cc*cell,qy+r*cell,cell,cell,'F');
      doc.setFontSize(6.4);doc.setTextColor(85);
      doc.text('Girocode: mit der Banking-App',qx+size/2,qy+size+3.4,{align:'center'});
      doc.text('scannen und bezahlen',qx+size/2,qy+size+6.2,{align:'center'});
    }catch(e){}
  }

  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);footer(i,pages);}
  return doc;
}

const ENC=new TextEncoder();
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function le(n,v){const b=new Uint8Array(n);for(let i=0;i<n;i++)b[i]=(v>>>(8*i))&255;return b;}
function zipStore(files){
  const parts=[],cdParts=[];let off=0,cdLen=0;
  const meta=[];
  files.forEach(f=>{
    const name=ENC.encode(f.name),data=f.data,c=crc32(data);
    const h=[le(4,0x04034b50),le(2,20),le(2,0),le(2,0),le(2,0),le(2,0),le(4,c),le(4,data.length),le(4,data.length),le(2,name.length),le(2,0),name];
    const hl=h.reduce((s,x)=>s+x.length,0);
    parts.push(...h,data);meta.push({name,c,len:data.length,off});off+=hl+data.length;
  });
  meta.forEach(e=>{
    const h=[le(4,0x02014b50),le(2,20),le(2,20),le(2,0),le(2,0),le(2,0),le(2,0),le(4,e.c),le(4,e.len),le(4,e.len),
      le(2,e.name.length),le(2,0),le(2,0),le(2,0),le(2,0),le(4,0),le(4,e.off),e.name];
    cdLen+=h.reduce((s,x)=>s+x.length,0);cdParts.push(...h);
  });
  const end=[le(4,0x06054b50),le(2,0),le(2,0),le(2,meta.length),le(2,meta.length),le(4,cdLen),le(4,off),le(2,0)];
  return new Blob([...parts,...cdParts,...end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function sheetXml(rows){
  const body=rows.map((row,i)=>`<row r="${i+1}">`+row.map((c,j)=>{
    const ref=colName(j)+(i+1);
    if(c===null||c===undefined||c==='')return'';
    if(typeof c==='number')return `<c r="${ref}" s="${i===0?1:2}"><v>${c}</v></c>`;
    return `<c r="${ref}" s="${i===0?1:0}" t="inlineStr"><is><t xml:space="preserve">${xesc(c)}</t></is></c>`;
  }).join('')+'</row>').join('');
  const cols=(rows[0]||[]).map((_,j)=>`<col min="${j+1}" max="${j+1}" width="${j===0?14:j===1?34:16}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${cols}</cols><sheetData>${body}</sheetData></worksheet>`;
}

  sheets.forEach((s,i)=>add(`xl/worksheets/sheet${i+1}.xml`,sheetXml(s.rows)));
  return zipStore(files);
}

/* ===================== sevdesk / CSV-Import ===================== */
function parseCSV(txt){
  txt=txt.replace(/\ufeff/g,'');
  const delim=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r')cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

/* ---------- sevdesk erkennt sich selbst: Kopfzeile prüfen und komplett übernehmen ---------- */
function sevdeskKind(h){
  const s=h.map(x=>String(x).replace(/\ufeff/g,'').trim().toLowerCase());
  const has=n=>s.some(x=>x.indexOf(n)>=0);
  if(has('belegnummer')&&has('lieferant / kunde'))return 'vouchers';
  if(has('rechnungs-nr.')&&has('empfänger-kdnr'))return 'invoices';
  if(has('kunden-nr.')&&has('organisation'))return 'contacts';
  return '';
}
const SEV_FIRMA=/(GmbH|mbH|\bKG\b|\bAG\b|e\.K\.|\bUG\b|GbR|Agentur|Consulting|Immobilien|Personal|Landschaftsbau|Gartenservice|WEG |Verwaltung)/i;
const SEV_CAT={
 'Einkauf Roh-, Hilfs und Betriebsstoffe':['Material & Pflanzen','Material'],
 'Materialeinkauf':['Material & Pflanzen','Material'],
 'Sonstige Anschaffungen':['Material & Pflanzen','Material & Zubehör'],
 'Werkzeuge und Kleingeräte':['Werkzeug & Maschinen','Werkzeug'],
 'Kauf einer Maschine':['Werkzeug & Maschinen','Maschine'],
 'Werbekosten':['Werbung & Marketing','Werbung'],
 'Aufwand Abraum-/Abfallbeseitigung':['Entsorgung','Grünschnitt-Entsorgung'],
 'Müllgebühren':['Entsorgung','Müllgebühr'],
 'sonstige betriebliche Aufwendungen':['Sonstiges','Betriebsausgabe'],
 'Sonstige Kfz-Kosten':['Fahrzeug & Sprit','Kfz-Kosten'],
 'Software-Miete / Lizenzen':['Büro & Software','Software'],
 'Bürobedarf':['Büro & Software','Bürobedarf'],
 'Sonstige Abgaben':['Sonstiges','Gebühr'],
 'Sonstiger Betriebsbedarf':['Sonstiges','Betriebsbedarf']
};
function sevdeskImport(rows){
  const h=rows[0].map(x=>String(x).replace(/\ufeff/g,'').trim());
  const art=sevdeskKind(h);if(!art)return null;
  const ci={};h.forEach((x,i)=>ci[x.toLowerCase()]=i);
  const g=(r,name)=>{const i=ci[name.toLowerCase()];return i===undefined?'':String(r[i]||'').trim();};
  const data=rows.slice(1).filter(r=>r.some(x=>String(x).trim()!==''));
  const s=db.settings;let n=0,neu=0;

  if(art==='contacts'){
    data.forEach(r=>{
      const nr=g(r,'Kunden-Nr.'),kat=g(r,'Kategorie');
      if(kat.toLowerCase()==='lieferant')return;
      let last=g(r,'Nachname'),first=g(r,'Vorname'),company='';
      let anrede={w:'Frau',m:'Herr'}[g(r,'Anrede').toLowerCase()]||'';
      const org=g(r,'Organisation');
      if(!last&&org){
        if(SEV_FIRMA.test(org))company=org;
        else{
          let o=org,m=o.match(/^(Frau|Herr)\s+(.*)$/);
          if(m){anrede=anrede||m[1];o=m[2];}
          const t=o.split(/\s+/).filter(Boolean);
          last=t.pop()||'';first=t.join(' ');
        }
      }
      if(!last&&!company)return;
      const c={id:uid(),number:nr||s.numbers.custNext++,anrede,company,first,last,name:'',
        street:g(r,'Strasse'),zip:g(r,'PLZ'),city:g(r,'Ort'),country:g(r,'Land')||'Deutschland',
        email:g(r,'E-Mail'),phone:g(r,'Telefon')||g(r,'Mobil'),notes:''};
      c.name=custName(c);
      const vorhanden=db.customers.find(x=>String(x.number)===String(c.number)||custName(x).toLowerCase()===c.name.toLowerCase());
      if(vorhanden){['first','last','company','street','zip','city','email','phone','anrede'].forEach(k=>{if(!vorhanden[k]&&c[k])vorhanden[k]=c[k];});
        vorhanden.name=custName(vorhanden);}
      else{db.customers.push(c);neu++;}
      n++;
      const cn=parseInt(c.number,10);if(cn>=s.numbers.custNext)s.numbers.custNext=cn+1;
    });
    return {art:'Kontakte',n,neu};
  }

  if(art==='invoices'){
    data.forEach(r=>{
      const nr=g(r,'Rechnungs-Nr.'),d=pickDate(g(r,'Rechnungs-Datum'));
      if(!nr)return;
      if(db.invoices.some(i=>i.number===nr&&i.date===d))return;
      const brutto=num(g(r,'Gesamtbetrag-Brutto')),offen=num(g(r,'offener Betrag'));
      const kdnr=g(r,'Empfänger-KdNr');
      let c=db.customers.find(x=>String(x.number)===kdnr);
      if(!c){
        const adr=g(r,'Empfänger-Adresse');
        c=migCustomer({id:uid(),number:kdnr||s.numbers.custNext++,name:adr||'Unbekannt',street:'',zip:'',city:'',
          country:g(r,'Empfänger-Land')||'Deutschland',email:'',phone:'',notes:'aus Rechnungsimport – Adresse prüfen'});
        db.customers.push(c);neu++;
      }
      const storno=brutto<0;
      const inv={id:uid(),number:nr,customerId:c.id,date:d,deliveryDate:d,
        dueDate:g(r,'Fällig am')?pickDate(g(r,'Fällig am')):addDays(d,s.defaults.paymentDays),
        positions:[{desc:storno?'Stornierung':'Gartenpflege – Übernahme aus sevdesk',qty:1,unit:'Pauschal',price:brutto}],
        payments:[],draft:false,klein:s.defaults.klein,vat:s.defaults.vat,intro:s.defaults.introInv,note:'',imported:true};
      const bezahlt=brutto-offen;
      if(Math.abs(bezahlt)>0.005)inv.payments.push({date:g(r,'Bezahlt am')?pickDate(g(r,'Bezahlt am')):d,amount:+bezahlt.toFixed(2)});
      db.invoices.push(inv);n++;
      const p=s.numbers.invPrefix,v=parseInt(String(nr).replace(p,''),10);
      if(String(nr).indexOf(p)===0&&v&&v<9000&&v>=s.numbers.invNext)s.numbers.invNext=v+1;
    });
    return {art:'Rechnungen',n,neu};
  }

  // Belege: Kopfzeile ohne Position, danach die Positionszeilen
  let kopf=null;
  data.forEach(r=>{
    if(!g(r,'Position')){
      kopf={nr:g(r,'Belegnummer'),sup:g(r,'Lieferant / Kunde'),date:pickDate(g(r,'Datum'))};
      return;
    }
    if(!kopf)return;
    const kat=g(r,'Kategorie'),brutto=num(g(r,'Betrag'));
    if(!brutto)return;
    const map=SEV_CAT[kat]||['Sonstiges','Betriebsausgabe'];
    let cat=map[0],label=map[1];
    const sl=kopf.sup.toLowerCase();
    if(/strauss/.test(sl)){cat='Arbeitskleidung';label='Arbeitskleidung';}
    else if(/kompost|zva|wertstoff|deponie/.test(sl)){cat='Entsorgung';label='Grünschnitt-Entsorgung';}
    else if(/boels|rental|miete/.test(sl)){cat='Sonstiges';label='Gerätemiete';}
    else if(/hammer|fiverr|vistaprint|marketing/.test(sl))cat='Werbung & Marketing';
    else if(/sevdesk|lexoffice/.test(sl)){cat='Büro & Software';label='Buchhaltungssoftware';}
    const behoerde=/landratsamt|stadt |markt |zva|gemeinde/.test(sl);
    const ustsatz=num(g(r,'Umsatzsteuersatz'));
    const e={id:uid(),date:kopf.date,desc:g(r,'Beschreibung')||(label+' '+kopf.sup).trim(),
      category:cat,amount:brutto,vat:ustsatz>0?ustsatz:(behoerde?0:19),vendor:kopf.sup,km:0,receipt:'',
      note:'Beleg-Nr. '+kopf.nr};
    if(db.expenses.some(x=>x.date===e.date&&Math.abs((+x.amount||0)-brutto)<0.005&&x.vendor===e.vendor))return;
    e.kind=classify(e);e.kindAuto=true;
    if(e.kind==='anlage')linkAsset(e,db);
    db.expenses.push(e);n++;
  });
  return {art:'Belege',n,neu:0};
}

function pickDate(v){
  v=String(v||'').trim();if(!v)return today();
  let m=v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  return today();
}

    Object.entries(groups).forEach(([no,rs])=>{
      if(db.invoices.some(i=>i.number===no))return;
      const r0=rs[0],cid=findOrCreateCustomer(gv(r0,'name'));
      const date=pickDate(gv(r0,'date'));
      const positions=rs.map(r=>{
        const qty=num(gv(r,'qty'))||1,price=num(gv(r,'price')),tot=num(gv(r,'amount'));
        return {desc:gv(r,'desc')||'Leistung laut Rechnung '+no,qty,unit:'Stk',price:price||(qty?tot/qty:tot)};
      }).filter(p=>p.price||p.qty);
      if(!positions.length)positions.push({desc:'Übernahme aus sevdesk',qty:1,unit:'Stk',price:num(gv(r0,'amount'))});
      const inv={id:uid(),number:no,customerId:cid,date,deliveryDate:pickDate(gv(r0,'delivery'))||date,
        dueDate:gv(r0,'due')?pickDate(gv(r0,'due')):addDays(date,s.defaults.paymentDays),
        positions,payments:[],draft:false,klein:s.defaults.klein,vat:s.defaults.vat,intro:s.defaults.introInv,note:'',imported:true};
      const pd=gv(r0,'paidDate'),st=gv(r0,'status').toLowerCase();
      if(pd||st.includes('bezahlt')||st.includes('paid'))
        inv.payments.push({date:pd?pickDate(pd):inv.dueDate,amount:+totals(inv).gross.toFixed(2)});
      db.invoices.push(inv);n++;
      const numPart=+no.replace(/\D/g,'');
      if(no.startsWith(s.numbers.invPrefix)&&numPart>=s.numbers.invNext)s.numbers.invNext=numPart+1;
    });
  }
  save();closeSheets();render();toast(n+' Datensätze importiert');
}

function findArrays(obj,path='',out=[],depth=0){
  if(depth>4||!obj||typeof obj!=='object')return out;
  if(Array.isArray(obj)){if(obj.length&&typeof obj[0]==='object')out.push({path,len:obj.length,keys:Object.keys(obj[0])});return out;}
  Object.entries(obj).forEach(([k,v])=>findArrays(v,path?path+'.'+k:k,out,depth+1));
  return out;
}
const getPath=(o,p)=>p?p.split('.').reduce((a,k)=>a?.[k],o):o;

function bridgeSaveCfg(){
  const q=s=>document.querySelector(s),b=db.settings.bridge;
  b.key=q('#b_key').value;b.path=q('#b_path')?.value||'';
  b.map={date:q('#b_f_date').value,amount:q('#b_f_amount').value,text:q('#b_f_text').value,
    category:q('#b_f_category').value,type:q('#b_f_type').value};
  b.typeValue=q('#b_typeval').value;b.category=q('#b_cat').value;b.text=q('#b_text').value;

}
function bridgeTransfer(tag,amount){
  bridgeSaveCfg();
  const b=db.settings.bridge;
  if(!b.key||!b.map.date||!b.map.amount){toast('Bitte mindestens Datum und Betrag zuordnen');return;}
  const raw=localStorage.getItem(b.key);
  let obj;try{obj=JSON.parse(raw);}catch(e){toast('Kassenbuch nicht lesbar');return;}
  const arr=getPath(obj,b.path);
  if(!Array.isArray(arr)){toast('Buchungsliste nicht gefunden');return;}
  const m=+tag.slice(5,7),y=+tag.slice(0,4);
  const lastDay=new Date(y,m,0).getDate();
  const entry={};
  const sample=arr[0]||{};
  Object.keys(sample).forEach(k=>{entry[k]=typeof sample[k]==='number'?0:'';});
  if('id' in sample)entry.id=uid();
  entry[b.map.date]=`${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  entry[b.map.amount]=typeof sample[b.map.amount]==='string'?String(amount):+amount;
  if(b.map.text)entry[b.map.text]=b.text.replace('{monat}',MONTHS[m-1]+' '+y);
  if(b.map.category)entry[b.map.category]=b.category;
  if(b.map.type)entry[b.map.type]=b.typeValue||'einnahme';
  localStorage.setItem(b.key+'__backup_buero',raw);
  arr.push(entry);
  try{localStorage.setItem(b.key,JSON.stringify(obj));}catch(e){toast('Schreiben fehlgeschlagen');return;}
  b.done.push(tag);save();closeSheets();
  toast(MONTHS[m-1]+': '+eur(amount)+' ins Kassenbuch übertragen');
}

/* ===================== Beleg-Scan (KI) ===================== */
async function scanReceipt(dataUrl){
  try{
    const b64=dataUrl.split(',')[1];
    const headers={'Content-Type':'application/json'};
    if(db.settings.ai.key){
      headers['x-api-key']=db.settings.ai.key;
      headers['anthropic-version']='2023-06-01';
      headers['anthropic-dangerous-direct-browser-access']='true';
    }
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers,
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
        {type:'text',text:'Lies diesen Kassenbon oder diese Rechnung aus. Antworte AUSSCHLIESSLICH mit einem JSON-Objekt, ohne Markdown, ohne Erklärung:\n{"datum":"YYYY-MM-DD","betrag":Bruttogesamtbetrag als Zahl,"ustsatz":19 oder 7 oder 0,"haendler":"Name des Händlers","beschreibung":"kurze Beschreibung des Einkaufs, max 5 Wörter","kategorie":"eine aus: '+CATS.join(', ')+'"}\nWenn ein Feld nicht erkennbar ist, lass es weg. Der Betrag ist der Endbetrag (brutto).'}
      ]}]})});
    const data=await res.json();
    const txt=(data.content||[]).map(x=>x.text||'').join('');
    const m=txt.match(/\{[\s\S]*\}/);
    if(!m)return null;
    return JSON.parse(m[0]);
  }catch(e){return null;}
}

function tips(){

  });

  db.assets.filter(a=>!a.sonder&&['afa','degressiv'].includes(a.type)&&+a.date.slice(0,4)>=y-1).forEach(a=>{

  });

  db.assets.filter(a=>a.cost>GWG_LIMIT&&a.cost<=1600&&a.type!=='gwg').forEach(a=>{
    add('„'+a.name+'" könnte GWG werden',
      'Mit einem vorher gebildeten Investitionsabzugsbetrag sinken die Anschaffungskosten um bis zu 50% — damit rutschen Käufe bis 1.600 € unter die 800-€-Grenze und sind sofort voll absetzbar.',0);
  });

    add('Investitionsabzugsbetrag bilden',
      'Planst du in den nächsten drei Jahren eine größere Anschaffung (Anhänger, Aufsitzmäher, Transporter)? Dann darfst du 50% der geplanten Kosten schon dieses Jahr vom Gewinn abziehen. Bei 6.000 € geplanter Investition sind das 3.000 € weniger Gewinn.',3000*mr);
  db.iab.filter(i=>!i.resolvedYear&&+i.year+3<=y).forEach(i=>
    add('Frist läuft ab: IAB „'+i.name+'"',

  // Homeoffice
  const hoD=db.settings.tax.homeoffice[y]||0;
  if(hoD*6<1260)add('Homeoffice-Tagespauschale',
    'Für Tage, an denen du überwiegend zu Hause fürs Gewerbe arbeitest (Angebote schreiben, Buchhaltung, Planung), gibt es 6 € pro Tag, maximal 1.260 € im Jahr. Bisher gezählt: '+hoD+' Tage = '+eur(hoD*6)+'. Der Höchstbetrag gilt für alle Tätigkeiten zusammen.',(1260-hoD*6)*mr*0.5);
  // Telefon
  if(!hasExpense(y,/telefon|handy|mobil|internet|dsl/))add('Telefon und Internet anteilig',
    'Der betrieblich genutzte Anteil deines Handy- und Internetvertrags ist Betriebsausgabe. Ohne Einzelnachweis werden üblicherweise 20% anerkannt, maximal 20 € im Monat — 240 € im Jahr.',240*mr);
  // Arbeitskleidung
  if(!hasExpense(y,/kleidung|schuhe|schutz|handschuh/))add('Schutzkleidung und Ausrüstung',
    'Sicherheitsschuhe, Schnittschutzhose, Gehörschutz, Arbeitshandschuhe, auch die Reinigung: alles voll absetzbar, weil es typische Berufskleidung ist. Normale Kleidung dagegen nicht.',0);
  // Fortbildung
  if(!hasExpense(y,/schulung|fortbild|kurs|seminar|fachbuch|literatur/))add('Fortbildung und Fachliteratur',
    'Motorsägenkurs, Pflanzenschutz-Sachkunde, Fachbücher, Software-Abos: Betriebsausgabe. Der Sachkundenachweis ist bei Pflanzenschutz ohnehin Pflicht.',0);
  // Versicherung / SVLFG
  if(!hasExpense(y,/versicher|haftpflicht|berufsgenossen|svlfg/))add('Versicherungen und Berufsgenossenschaft',
    'Betriebshaftpflicht ist bei Gartenarbeit auf fremden Grundstücken das Wichtigste überhaupt — ein umgesägter Ast im Wintergarten kostet mehr als jede Prämie. Beiträge sind voll absetzbar. Prüf außerdem, ob dein Betrieb bei der SVLFG anmeldepflichtig ist: der Garten- und Landschaftsbau fällt dort grundsätzlich hinein, auch als Kleingewerbe.',0);
  // Konto
  if(!hasExpense(y,/konto|bank|gebühr/))add('Getrenntes Geschäftskonto',
    'Kontoführungsgebühren des Geschäftskontos sind absetzbar — wichtiger noch: ein eigenes Konto trennt privat und betrieblich sauber und macht die Prüfung im Zweifel harmlos.',0);
  // Belege ohne Foto
  const noRec=db.expenses.filter(e=>e.date.slice(0,4)==String(y)&&!e.receipt);

    'Ohne Beleg kann das Finanzamt die Ausgabe streichen. Summe im Risiko: '+eur(sum(noRec,e=>+e.amount||0))+'. Beleg einfach nachfotografieren.',0);

  if(profit<0)add('Verlust senkt deine Lohnsteuer',

    'Dein Gewinn liegt deutlich über dem Vorjahr. Das Finanzamt setzt Vorauszahlungen rückwirkend fest — leg die Rücklage jetzt beiseite, sonst kommen Nachzahlung und Vorauszahlung im selben Quartal.',0);
  // Kleinunternehmer-Verzicht
  const bigPlan=Math.max(0,...db.iab.filter(i=>!i.resolvedYear).map(i=>+i.cost||0),...db.assets.filter(a=>+a.date.slice(0,4)===y).map(a=>+a.cost||0));

  add('Kinderbetreuung in der Steuererklärung',

    'Kundengeschenke bis 50 € pro Person und Jahr sind absetzbar, wenn du sie getrennt aufzeichnest. Bewirtung von Geschäftspartnern zu 70%, mit maschinellem Bewirtungsbeleg.',0);
  // Backup
  const lb=db.settings.tax.lastBackup;
  if(!lb||(new Date()-new Date(lb))/864e5>30)add('Backup ist überfällig',
    'Deine Buchhaltung liegt nur auf diesem Gerät. '+(lb?'Letzte Sicherung: '+dDE(lb)+'.':'Noch nie gesichert.')+' Aufbewahrungspflicht für Buchungsbelege sind acht Jahre.',0);
  return t.sort((a,b)=>b.save-a.save);

/* ===================================================================
   Cloud-Sync
   Ablage: eine JSON-Datei in einem PRIVATEN GitHub-Repo.
   Läuft in Safari auf iPhone, iPad und Mac — ohne Server, ohne Abo.
   Zusammenführung erfolgt datensatzweise über Zeitstempel (_ts),
   Löschungen über Grabsteine (db.tomb). Kein blindes Überschreiben.
   =================================================================== */
const COLLS=['customers','items','invoices','offers','expenses','assets','times','iab'];
const nowIso=()=>new Date().toISOString();
let _snap=null,syncBusy=false,syncTimer=null,syncLast=0,syncState='';

function bodyOf(r){const c={...r};delete c._ts;return JSON.stringify(c);}
function snapBodies(){
  const m={};
  COLLS.forEach(k=>(db[k]||[]).forEach(r=>{if(r&&r.id)m[k+':'+r.id]=bodyOf(r);}));
  m['settings']=settingsBody();
  return m;
}
function settingsBody(){
  const c=structuredClone(db.settings);delete c.sync;if(c.ai)c.ai={key:''};
  return JSON.stringify(c);
}
/* Erkennt beim Sichern automatisch, welche Datensätze sich geändert haben */
function trackChanges(){
  db.tomb=db.tomb||{};
  const t=nowIso(),cur=snapBodies();
  Object.keys(cur).forEach(key=>{
    if(key==='settings'){
      if(!_snap){
        // Erststart: nur ein Gerät, auf dem schon Daten liegen, gilt als Quelle der Einstellungen
        if(!db.settingsTs&&COLLS.some(k=>(db[k]||[]).length))db.settingsTs=t;
      }else if(_snap[key]!==cur[key])db.settingsTs=t;
      return;
    }
    const [k,id]=[key.slice(0,key.indexOf(':')),key.slice(key.indexOf(':')+1)];
    const r=(db[k]||[]).find(x=>x.id===id);if(!r)return;
    if(!_snap){if(!r._ts)r._ts=t;}
    else if(_snap[key]!==cur[key])r._ts=t;
    if(db.tomb[key])delete db.tomb[key];
  });
  if(_snap)Object.keys(_snap).forEach(key=>{if(key!=='settings'&&!(key in cur))db.tomb[key]=t;});
  const grenze=new Date(Date.now()-90*864e5).toISOString();
  Object.keys(db.tomb).forEach(k=>{if(db.tomb[k]<grenze)delete db.tomb[k];});
  _snap=cur;
}
const resnap=()=>{_snap=snapBodies();};

function syncPayload(){
  const cfg=db.settings.sync;
  const d=structuredClone(db);
  delete d.settings.sync;
  if(d.settings.ai)d.settings.ai={key:''};
  if(!cfg.photos)(d.expenses||[]).forEach(e=>{if(e.receipt)e.receipt='';});
  return {v:2,app:'gartenflo-buero',device:cfg.device||'',updatedAt:nowIso(),
    settingsTs:db.settingsTs||'',tomb:db.tomb||{},data:d};
}
function mergeRemote(rem){
  if(!rem||!rem.data)return 0;
  let changed=0;const rt=rem.tomb||{};
  db.tomb=db.tomb||{};
  COLLS.forEach(k=>{
    const mine=db[k]||[],theirs=rem.data[k]||[];
    theirs.forEach(r=>{
      if(!r||!r.id)return;
      const key=k+':'+r.id,m=mine.find(x=>x.id===r.id);
      if(db.tomb[key]&&db.tomb[key]>=(r._ts||''))return;      // hier gelöscht, und das war später
      if(!m){mine.push(structuredClone(r));changed++;return;}
      if((r._ts||'')>(m._ts||'')){
        const foto=m.receipt;
        Object.keys(m).forEach(x=>{if(!(x in r))delete m[x];});
        Object.assign(m,structuredClone(r));
        if(foto&&!m.receipt)m.receipt=foto;                   // lokales Belegfoto nie verlieren
        changed++;
      }
    });
    Object.keys(rt).forEach(key=>{
      if(key.indexOf(k+':')!==0)return;
      const id=key.slice(k.length+1),i=mine.findIndex(x=>x.id===id);
      if(i>=0&&rt[key]>(mine[i]._ts||'')){mine.splice(i,1);changed++;}
      if(!db.tomb[key]||db.tomb[key]<rt[key])db.tomb[key]=rt[key];
    });
    db[k]=mine;
  });
  if(rem.settingsTs&&rem.settingsTs>(db.settingsTs||'')&&rem.data.settings){
    const sync=db.settings.sync,key=db.settings.ai?db.settings.ai.key:'';
    db.settings=rem.data.settings;db.settings.sync=sync;
    db.settings.ai=db.settings.ai||{};db.settings.ai.key=key;
    db.settingsTs=rem.settingsTs;changed++;
  }
  healCounters(rem);
  if(changed)resnap();
  return changed;
}
/* Nummernkreise geräteübergreifend hochziehen: der höchste Stand gewinnt */
function healCounters(rem){
  const n=db.settings.numbers;
  const rn=(rem.data&&rem.data.settings&&rem.data.settings.numbers)||{};
  ['invNext','offNext','custNext'].forEach(k=>n[k]=Math.max(+n[k]||0,+rn[k]||0));
  const hoechste=(arr,pre)=>arr.reduce((m,d)=>{
    const v=parseInt(String(d.number||'').replace(pre,'').replace(/\D/g,''),10)||0;return v>m?v:m;},0);
  n.invNext=Math.max(n.invNext,hoechste(db.invoices||[],n.invPrefix)+1);
  n.offNext=Math.max(n.offNext,hoechste(db.offers||[],n.offPrefix)+1);
  n.custNext=Math.max(n.custNext,(db.customers||[]).reduce((m,c)=>Math.max(m,+c.number||0),0)+1);
}

/* ---------- GitHub-Ablage ---------- */
const b64enc=str=>{const u=new TextEncoder().encode(str);let b='';const CH=0x8000;
  for(let i=0;i<u.length;i+=CH)b+=String.fromCharCode.apply(null,u.subarray(i,i+CH));return btoa(b);};
const b64dec=x=>{const bin=atob(String(x).replace(/\s/g,''));const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
const ghHead=cfg=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json',
  'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'});
const ghUrl=cfg=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${String(cfg.path||'buero-daten.json').replace(/^\/+/,'')}`;
async function ghGet(cfg){
  const r=await fetch(ghUrl(cfg)+`?ref=${encodeURIComponent(cfg.branch||'main')}&_=${Date.now()}`,
    {headers:ghHead(cfg),cache:'no-store'});
  if(r.status===404)return {missing:true};
  if(r.status===401)throw new Error('Token ungültig oder abgelaufen');
  if(r.status===403)throw new Error('Kein Zugriff — Repo-Berechtigung prüfen');
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();
  let json=null;try{json=JSON.parse(b64dec(j.content));}catch(e){throw new Error('Datei in der Cloud ist unlesbar');}
  return {sha:j.sha,json};
}
async function ghPut(cfg,payload,sha){
  const body={message:'Büro-Sync '+dDE(today())+' '+new Date().toLocaleTimeString('de-DE').slice(0,5),
    content:b64enc(JSON.stringify(payload)),branch:cfg.branch||'main'};
  if(sha)body.sha=sha;
  const r=await fetch(ghUrl(cfg),{method:'PUT',headers:ghHead(cfg),body:JSON.stringify(body)});
  if(r.status===409)throw new Error('conflict');
  if(!r.ok)throw new Error('GitHub '+r.status+' beim Hochladen');
  return r;
}
const syncReady=()=>{const c=db.settings.sync;return c.provider==='github'&&c.token&&c.owner&&c.repo;};
function setSyncState(st){
  syncState=st;
  const b=document.getElementById('syncbtn');if(!b)return;
  b.style.display=syncReady()?'inline-flex':'none';
  b.textContent={sync:'⟳',ok:'✓',err:'!'}[st]||'⟳';
  b.style.color=st==='err'?'var(--red)':st==='ok'?'var(--moss)':'var(--mut)';
  b.style.borderColor=st==='err'?'#43302e':'var(--line)';
}
function syncSchedule(){
  if(!syncReady()||!db.settings.sync.auto||syncBusy)return;
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true),2500);
}
async function syncNow(silent){
  if(!syncReady()){if(!silent)toast('Cloud-Sync ist noch nicht eingerichtet');return;}
  if(syncBusy)return;
  const cfg=db.settings.sync;
  syncBusy=true;setSyncState('sync');
  try{
    let rem=await ghGet(cfg);
    let changed=rem.missing?0:mergeRemote(rem.json);
    let payload=syncPayload();
    const remoteStr=rem.missing?null:JSON.stringify(rem.json&&rem.json.data);
    if(JSON.stringify(payload.data)!==remoteStr||(!rem.missing&&(rem.json.settingsTs||'')!==(payload.settingsTs||''))){
      try{await ghPut(cfg,payload,rem.sha);}
      catch(err){
        if(err.message!=='conflict')throw err;
        rem=await ghGet(cfg);                       // jemand war schneller: neu mischen und nochmal
        changed+=rem.missing?0:mergeRemote(rem.json);
        await ghPut(cfg,syncPayload(),rem.sha);
      }
    }
    cfg.lastSync=nowIso();syncLast=Date.now();
    saveQuiet();
    if(changed)render();
    setSyncState('ok');
    if(!silent)toast(changed?changed+' Änderung'+(changed>1?'en':'')+' übernommen':'Alles aktuell');
  }catch(e){
    setSyncState('err');
    if(!silent)toast('Sync-Fehler: '+e.message);
  }finally{syncBusy=false;}
}
async function syncForce(dir){
  if(!syncReady()){toast('Erst einrichten');return;}
  const cfg=db.settings.sync;
  if(dir==='up'&&!confirm('Alle Daten dieses Geräts in die Cloud schreiben und die Cloud-Version ersetzen?'))return;
  if(dir==='down'&&!confirm('Cloud-Stand laden und die Daten auf diesem Gerät ersetzen? Vorher wird eine Sicherung im Gerät angelegt.'))return;
  syncBusy=true;setSyncState('sync');
  try{
    if(dir==='up'){
      const rem=await ghGet(cfg);
      await ghPut(cfg,syncPayload(),rem.sha);
      toast('Hochgeladen');
    }else{
      const rem=await ghGet(cfg);
      if(rem.missing||!rem.json||!rem.json.data)throw new Error('In der Cloud liegt noch nichts');
      localStorage.setItem(LS+'_vor_sync',JSON.stringify(db));
      const sync=db.settings.sync,key=db.settings.ai?db.settings.ai.key:'';
      const fotos={};(db.expenses||[]).forEach(e=>{if(e.receipt)fotos[e.id]=e.receipt;});
      db=migrate(rem.json.data);
      db.settings.sync=sync;db.settings.ai=db.settings.ai||{};db.settings.ai.key=key;
      db.tomb=rem.json.tomb||{};db.settingsTs=rem.json.settingsTs||'';
      (db.expenses||[]).forEach(e=>{if(!e.receipt&&fotos[e.id])e.receipt=fotos[e.id];});
      resnap();saveQuiet();render();toast('Cloud-Stand geladen');
    }
    cfg.lastSync=nowIso();saveQuiet();setSyncState('ok');
  }catch(e){setSyncState('err');toast('Fehler: '+e.message);}
  finally{syncBusy=false;closeSheets();}
}
async function syncTest(){
  const cfg=db.settings.sync;
  try{
    const r=await ghGet(cfg);
    toast(r.missing?'Verbindung steht — Datei wird beim ersten Sync angelegt':'Verbindung steht — Datei gefunden');
    setSyncState('ok');
  }catch(e){toast('Fehler: '+e.message);setSyncState('err');}
}

/* ---------- iCloud Drive: Datei-Sicherung über die Teilen-Funktion ---------- */
async function icloudBackup(){
  const name=`Buero_${db.settings.company.name.replace(/\s+/g,'_')}_${today()}.json`;
  const txt=JSON.stringify(syncPayload());
  try{
    const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Büro-Sicherung'});
      db.settings.tax.lastBackup=today();saveQuiet();
      toast('Wähle „In Dateien sichern" → iCloud Drive');
      return;
    }
  }catch(e){}
  dl(name,txt,'application/json');
  toast('Datei gespeichert — in iCloud Drive ablegen');
}
function icloudRestore(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{
      try{
        const j=JSON.parse(r.result);
        const rem=j.data?j:{data:j,tomb:{},settingsTs:''};
        if(!rem.data.settings)throw 0;
        const n=mergeRemote(rem);
        trackChanges();saveQuiet();render();
        toast(n?n+' Änderung'+(n>1?'en':'')+' übernommen':'Nichts Neues in der Datei');
      }catch(e){toast('Datei konnte nicht gelesen werden');}};
    r.readAsText(f);};
  i.click();
}
