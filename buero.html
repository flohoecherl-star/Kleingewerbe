<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#0d1310; --surface:#151d18; --surface2:#1c2620; --line:#28362d;
  --txt:#e8f0ea; --mut:#8ba396; --dim:#5f7568;
  --moss:#5ecb84; --moss-d:#2f7a4c; --clay:#e0a458; --red:#e8695f; --blue:#6ea8dc;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
h1,h2,h3,.cond{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.4px}
a{color:var(--moss)}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0d1310 70%,rgba(13,19,16,0));padding:calc(10px + env(safe-area-inset-top)) 0 12px}
header.top .wrap{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--moss),var(--moss-d));display:grid;place-items:center;font-weight:700;color:#06210f;font-family:'Barlow Condensed';font-size:20px}
.ttl{font-size:22px;font-weight:700;text-transform:uppercase;line-height:1}
.sub{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
.lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:600}
.big{font-family:'Barlow Condensed';font-size:38px;font-weight:700;line-height:1.05}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mono{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:15px}
.btn{background:var(--surface2);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--moss);color:#06210f;border-color:var(--moss)}
.btn.dan{color:var(--red);border-color:#43302e}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
input,select,textarea{width:100%;background:#0f1714;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 11px}
textarea{resize:vertical;min-height:70px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-bottom:4px;font-weight:600}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(15,23,19,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;color:var(--dim);padding:9px 2px 10px;font-size:10.5px;font-weight:600;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button.on{color:var(--moss)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-offen{background:#1d2c3a;color:var(--blue)}
.p-bezahlt{background:#17301f;color:var(--moss)}
.p-faellig{background:#3a2220;color:var(--red)}
.p-teil{background:#33291a;color:var(--clay)}
.p-entwurf{background:#242f28;color:var(--mut)}
.p-angenommen{background:#17301f;color:var(--moss)}
.p-abgelehnt{background:#2a2422;color:var(--dim)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .g{flex:1;min-width:0}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mt{font-size:12.5px;color:var(--mut)}
.amt{font-family:'Barlow Condensed';font-size:21px;font-weight:600;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding-bottom:40px;animation:up .18s ease}
@keyframes up{from{transform:translateY(14px);opacity:.4}}
.sheet header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;z-index:5}
.sheet .body{padding:14px;max-width:820px;margin:0 auto}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 10px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--moss);color:#06210f}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--moss);border-radius:99px}
.chart{width:100%;height:150px}
.pos{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.pos .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.hint{font-size:12.5px;color:var(--mut)}
.warn{background:#33291a;border:1px solid #4d3d1f;color:#f0c987;border-radius:12px;padding:11px 12px;font-size:13.5px;margin-bottom:12px}
.info{background:#16242f;border:1px solid #24404f;color:#a9cfe6;border-radius:12px;padding:11px 12px;font-size:13.5px;margin-bottom:12px}
.empty{text-align:center;color:var(--dim);padding:34px 10px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--moss);color:#06210f;font-weight:600;padding:10px 18px;border-radius:99px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:45;width:56px;height:56px;border-radius:20px;background:var(--moss);color:#06210f;border:0;font-size:30px;font-weight:300;line-height:1;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th{text-align:left;color:var(--mut);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:5px 4px;border-bottom:1px solid var(--line)}
table.mini td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.mini td.n{text-align:right;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Druckansicht (A4) ---------- */
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  @page{size:A4;margin:14mm 16mm 12mm 20mm}
}
#print{font-family:Inter,Arial,sans-serif;color:#1a1a1a;font-size:10pt;line-height:1.45}
#print .ph{display:flex;justify-content:flex-end;margin-bottom:14mm}
#print .brand{text-align:right;font-family:'Barlow Condensed',Arial;line-height:1}
#print .brand .b1{font-size:26pt;color:#5a9e46;font-weight:600}
#print .brand .b2{font-size:9pt;letter-spacing:5px;color:#7d9a72}
#print .brand img{max-height:22mm}
#print .addr{display:flex;justify-content:space-between;gap:12mm}
#print .sender{font-size:6.8pt;color:#444;border-bottom:.4pt solid #999;padding-bottom:1mm;margin-bottom:2.5mm}
#print .meta{width:74mm;font-size:9pt}
#print .meta .h{display:flex;justify-content:space-between;font-size:13pt;font-weight:600;margin-bottom:2mm}
#print .meta .l{display:flex;justify-content:space-between;color:#333}
#print h1{font-size:14pt;margin:16mm 0 6mm;font-family:Inter,Arial;font-weight:700}
#print table{width:100%;border-collapse:collapse;margin-top:5mm}
#print th{font-size:9pt;text-align:right;padding:2mm 1.5mm;border-bottom:.6pt solid #333}
#print th:nth-child(1),#print th:nth-child(2){text-align:left}
#print td{padding:2.2mm 1.5mm;text-align:right;vertical-align:top;font-size:9.5pt}
#print td:nth-child(1),#print td:nth-child(2){text-align:left}
#print td:nth-child(2){font-weight:600}
#print tr.sum td{background:#f1f1f1;font-size:9.5pt}
#print tr.sum.b td{font-weight:700}
#print .foot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6mm;font-size:6.6pt;color:#555;border-top:.4pt solid #ccc;padding-top:2mm}
#print .foot div{flex:1}
#print .pay{margin-top:8mm;font-size:9.5pt}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo" id="hlogo">G</div>
    <div style="flex:1">
      <div class="ttl" id="htitle">Start</div>
      <div class="sub" id="hsub">Garten Flo · Büro</div>
    </div>
    <button class="btn sm" onclick="openSearch()">Suchen</button>
  </div>
</header>

<main class="wrap" id="view"></main>
<button class="fab" id="fab" onclick="fabAction()">+</button>

<nav class="tabbar" id="tabs"></nav>
<div id="sheets"></div>
<div id="print"></div>

<script>
/* ===================== Speicher ===================== */
const LS='gartenflo_office_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DEFAULT={
 settings:{
  company:{name:'Garten Flo',claim:'GARTENPFLEGE',owner:'Florian Höcherl',street:'Meisterweg 23',zip:'91085',city:'Weisendorf',country:'Deutschland',
    phone:'+49 15758531230',email:'garten-flo@gmx.net',taxNumber:'216/229/50755',bankName:'ING',
    iban:'DE51 5001 0517 5568 1903 81',bic:'INGDDEFFXXX',logo:''},
  defaults:{paymentDays:7,offerValidDays:14,klein:true,vat:19,hourRate:45,
    introInv:'vielen Dank für Ihren Auftrag und das damit verbundene Vertrauen!\nHiermit stelle ich Ihnen die folgenden Leistungen in Rechnung:',
    introOff:'vielen Dank für Ihre Anfrage!\nGerne unterbreite ich Ihnen folgendes Angebot:'},
  numbers:{invPrefix:'RE-',invNext:1106,offPrefix:'AN-',offNext:1001,custNext:1031},
  tax:{reserveRate:30,marginalRate:38,homeoffice:{},checklist:{},lastBackup:''},
  ai:{key:''},
  mail:{
   invSubject:'Rechnung {nummer} – {firma}',
   invBody:'{anrede}\n\nvielen Dank für Ihren Auftrag.\nIhre Rechnung {nummer} befindet sich im Anhang.\n\nBitte überweisen Sie den Betrag von {betrag} bis zum {faellig} auf:\nIBAN {iban}\nVerwendungszweck: {nummer}\n\nMit freundlichen Grüßen\n{inhaber}\n{firma} · {telefon}',
   offSubject:'Angebot {nummer} – {firma}',
   offBody:'{anrede}\n\nvielen Dank für Ihre Anfrage.\nMein Angebot {nummer} befindet sich im Anhang. Es ist gültig bis zum {faellig}.\n\nBei Fragen melden Sie sich gerne.\n\nMit freundlichen Grüßen\n{inhaber}\n{firma} · {telefon}',
   remSubject:'Zahlungserinnerung zu Rechnung {nummer}',
   remBody:'{anrede}\n\nsicher ist es Ihrer Aufmerksamkeit entgangen: die Rechnung {nummer} vom {datum} über {betrag} ist seit dem {faellig} fällig und noch offen.\n\nBitte überweisen Sie den offenen Betrag von {offen} auf:\nIBAN {iban}\nVerwendungszweck: {nummer}\n\nSollten Sie bereits gezahlt haben, betrachten Sie diese Nachricht bitte als gegenstandslos.\n\nMit freundlichen Grüßen\n{inhaber}\n{firma} · {telefon}'
  },
  bridge:{key:'',path:'',map:{date:'',amount:'',text:'',category:'',type:''},typeValue:'',category:'Nebeneinkommen',text:'Gewinn Garten Flo {monat}',done:[]}
 },
 customers:[],items:[],invoices:[],offers:[],expenses:[],assets:[],times:[],iab:[]
};
const SEED_ITEMS=[
 {name:'An- Abfahrt und Besorgungsfahrt',unit:'Stk',price:85},
 {name:'Arbeitsstunde Gartenpflege',unit:'Std',price:45},
 {name:'Rasen mähen inkl. Abtransport',unit:'Std',price:45},
 {name:'Heckenschnitt',unit:'lfm',price:12},
 {name:'Rindenmulch 3m3',unit:'Stk',price:278},
 {name:'Ausbringen Rindenmulch',unit:'Std',price:45},
 {name:'Entsorgungskosten',unit:'Stk',price:40},
 {name:'Vertikutieren',unit:'m²',price:1.2}
];
const CATS=['Material & Pflanzen','Fahrzeug & Sprit','Werkzeug & Maschinen','Entsorgung','Versicherung & Beiträge','Büro & Software','Arbeitskleidung','Fahrtkosten (km)','Fremdleistung','Sonstiges'];
/* Nutzungsdauer nach amtlicher AfA-Tabelle (AV), Richtwerte */
const ND=[
 ['Computer, Notebook, Handy, Software',1],
 ['Handwerkzeug, Kleingeräte',5],
 ['Motorsense, Kettensäge, Laubbläser',7],
 ['Rasenmäher, Vertikutierer',7],
 ['Häcksler, Aufsitzmäher, Anhänger',8],
 ['PKW / Transporter',6],
 ['Büromöbel',13],
 ['Sonstiges Betriebsgerät',8]
];
const GWG_LIMIT=800, POOL_MIN=250, POOL_MAX=1000;

let db=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(LS));if(r)return migrate(r);}catch(e){}
  const d=structuredClone(DEFAULT);
  d.items=SEED_ITEMS.map(i=>({id:uid(),...i}));
  return d;
}
function migrate(r){const d=structuredClone(DEFAULT);
  const deep=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=a[k]||{};deep(a[k],b[k]);}else if(a[k]===undefined)a[k]=b[k];}};
  deep(r,d);return r;}
function save(){localStorage.setItem(LS,JSON.stringify(db));}

/* ===================== Helfer ===================== */
const nf=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=n=>nf.format(n||0)+' €';
const today=()=>new Date().toISOString().slice(0,10);
const dDE=s=>s?String(s).slice(0,10).split('-').reverse().join('.'):'';
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const num=v=>{if(typeof v==='number')return v;const s=String(v??'').replace(/[^\d,.\-]/g,'');
  if(s.includes(',')&&s.includes('.'))return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  return parseFloat(s.replace(',','.'))||0;};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400);}
const cust=id=>db.customers.find(c=>c.id===id)||{name:'—'};
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function totals(d){
  const net=sum(d.positions||[],p=>(+p.qty||0)*(+p.price||0));
  const vat=d.klein?0:net*((+d.vat||0)/100);
  return {net,vat,gross:net+vat};
}
function paid(d){return sum(d.payments||[],p=>+p.amount||0);}
function statusOf(d){
  if(d.draft)return'entwurf';
  const t=totals(d).gross,p=paid(d);
  if(p>=t-0.005&&t>0)return'bezahlt';
  if(p>0)return'teilbezahlt';
  if(d.dueDate&&d.dueDate<today())return'faellig';
  return'offen';
}
const STL={entwurf:['Entwurf','p-entwurf'],offen:['Offen','p-offen'],faellig:['Fällig','p-faellig'],teilbezahlt:['Teilbezahlt','p-teil'],bezahlt:['Bezahlt','p-bezahlt'],
  angenommen:['Angenommen','p-angenommen'],abgelehnt:['Abgelehnt','p-abgelehnt']};
const pill=s=>`<span class="pill ${STL[s][1]}">${STL[s][0]}</span>`;

function incomeIn(y,m){
  let t=0;db.invoices.forEach(i=>(i.payments||[]).forEach(p=>{
    const d=p.date||'';if(d.slice(0,4)==String(y)&&(m==null||+d.slice(5,7)===m))t+=+p.amount||0;}));
  return t;}
function expenseIn(y,m){return sum(db.expenses.filter(e=>e.date.slice(0,4)==String(y)&&(m==null||+e.date.slice(5,7)===m)),e=>+e.amount||0);}
const revenueYear=y=>incomeIn(y,null);

/* ---------- AfA ---------- */
const DEG_FROM='2025-07-01',DEG_TO='2027-12-31';
const degAllowed=d=>d>=DEG_FROM&&d<=DEG_TO;
const _planCache=new Map();
function afaPlan(a){
  const key=JSON.stringify([a.date,a.cost,a.years,a.type,a.sonder]);
  if(_planCache.has(key))return _planCache.get(key);
  const plan={},buyY=+a.date.slice(0,4),buyM=+a.date.slice(5,7),cost=+a.cost||0;
  const add=(y,v)=>{if(v>0.004)plan[y]=(plan[y]||0)+v;};
  if(a.type==='gwg')add(buyY,cost);
  else if(a.type==='pool'){for(let k=0;k<5;k++)add(buyY+k,cost/5);}
  else{
    const nd=Math.max(1,+a.years||5);
    const rate=a.type==='degressiv'?Math.min(0.3,3/nd):0;
    let rest=cost,remaining=nd;
    for(let y=buyY;rest>0.005&&y<buyY+nd+3;y++){
      const f=y===buyY?(13-buyM)/12:1;
      const deg=rest*rate*f, lin=remaining>0?rest/remaining*f:rest;
      let v=Math.max(deg,lin);
      if(y===buyY&&a.sonder)v+=cost*0.4;
      v=Math.min(v,rest);
      add(y,v);rest-=v;remaining-=f;
      if(remaining<=0.01&&rest>0.005){add(y,rest);rest=0;}
    }
  }
  _planCache.set(key,plan);return plan;
}
const afaYear=(a,y)=>afaPlan(a)[y]||0;
function bookValue(a,y){let s=0;const p=afaPlan(a);Object.keys(p).forEach(k=>{if(+k<=y)s+=p[k];});return Math.max(0,(+a.cost||0)-s);}
const afaTotal=y=>sum(db.assets,a=>afaYear(a,y));
const iabYear=y=>sum(db.iab.filter(i=>+i.year===y),i=>+i.amount||0)-sum(db.iab.filter(i=>+i.resolvedYear===y),i=>+i.amount||0);
const profitYear=y=>revenueYear(y)-expenseIn(y,null)-afaTotal(y)-iabYear(y)-homeofficeSum(y);
function homeofficeSum(y){const d=db.settings.tax.homeoffice[y]||0;return Math.min(1260,d*6);}
const mrate=()=>(db.settings.tax.marginalRate||38)/100;

/* ===================== Navigation ===================== */
const TABS=[
 ['start','Start','M3 11l9-8 9 8M5 10v10h14V10'],
 ['inv','Rechnungen','M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'],
 ['off','Angebote','M4 5h16v14H4zM8 10h8M8 14h5'],
 ['exp','Ausgaben','M3 12h18M12 3v18'],
 ['more','Mehr','M4 6h16M4 12h16M4 18h16']
];
let tab='start';
function drawTabs(){document.getElementById('tabs').innerHTML=TABS.map(t=>
 `<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24"><path d="${t[2]}"/></svg>${t[1]}</button>`).join('');}
function go(t){tab=t;drawTabs();render();window.scrollTo(0,0);}
function fabAction(){({start:()=>editDoc('invoice'),inv:()=>editDoc('invoice'),off:()=>editDoc('offer'),exp:()=>editExpense(),more:()=>editCustomer()})[tab]();}

function render(){
  const v=document.getElementById('view');
  document.getElementById('htitle').textContent=({start:'Start',inv:'Rechnungen',off:'Angebote',exp:'Ausgaben',more:'Mehr'})[tab];
  document.getElementById('hsub').textContent=db.settings.company.name+' · Büro';

/* ===================== Start / Statistik ===================== */
let statYear=new Date().getFullYear();
function vStart(){
  const y=statYear,now=new Date();
  const inc=revenueYear(y),ex=expenseIn(y,null),afa=afaTotal(y),iabY=iabYear(y),hoY=homeofficeSum(y),profit=inc-ex-afa-iabY-hoY;
  const open=db.invoices.filter(i=>['offen','faellig','teilbezahlt'].includes(statusOf(i)));
  const openSum=sum(open,i=>totals(i).gross-paid(i));
  const over=open.filter(i=>statusOf(i)==='faellig');
  const prev=revenueYear(y-1);
  const limit=25000,pct=Math.min(100,inc/limit*100);
  const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d);}
  const mi=months.map(d=>incomeIn(d.getFullYear(),d.getMonth()+1));
  const me=months.map(d=>expenseIn(d.getFullYear(),d.getMonth()+1));
  const due=recurringDue();
  const reserve=Math.max(0,profit)*(db.settings.tax.reserveRate/100);

  return `
  ${due.length?`<div class="warn"><b>${due.length} Serienrechnung${due.length>1?'en':''} fällig.</b><br>
    ${due.map(r=>`${esc(cust(r.customerId).name)} · ${dDE(r.recurring.next)}`).join('<br>')}

  ${unbilled.length?`<div class="info"><b>${unbilled.length} nicht abgerechnete Stunden-Einträge</b> (${nf.format(sum(unbilled,t=>+t.hours||0))} Std).
    <div style="margin-top:8px"><button class="btn sm" onclick="openTimes()">Zeiterfassung öffnen</button></div></div>`:''}

  <div class="card">
    <div class="row between"><span class="lbl">Gewinn vor Steuern ${y}</span>
      <select style="width:auto;padding:5px 8px;font-size:13px" onchange="statYear=+this.value;render()">
        ${[y+1,y,y-1,y-2].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}
      </select></div>
    <div class="big mono" style="color:${profit>=0?'var(--moss)':'var(--red)'}">${eur(profit)}</div>
    <div class="grid3" style="margin-top:12px">
      <div><div class="lbl">Einnahmen</div><div class="amt mono">${eur(inc)}</div></div>
      <div><div class="lbl">Ausgaben</div><div class="amt mono" style="color:var(--clay)">${eur(ex)}</div></div>
      <div><div class="lbl">AfA</div><div class="amt mono" style="color:var(--clay)">${eur(afa)}</div></div>
    </div>
    ${(iabY||hoY)?`<div class="hint" style="margin-top:8px">zusätzlich abgezogen: ${iabY?'Investitionsabzugsbetrag '+eur(iabY):''}${iabY&&hoY?' · ':''}${hoY?'Homeoffice-Pauschale '+eur(hoY):''}</div>`:''}
    ${barChart(months.map(d=>d.toLocaleDateString('de-DE',{month:'short'})),mi,me)}

  </div>

    <div class="row between"><span class="lbl">Steuer sparen</span><span class="hint">${tips().length} Hinweise</span></div>

      <div class="row between"><b>${esc(t.title)}</b>${t.save?`<span class="amt mono" style="color:var(--moss)">${eur(t.save)}</span>`:''}</div>
      <div class="hint">${esc(t.body)}</div></div>`).join('')}

      <div><div class="amt mono" style="color:var(--clay)">${open.filter(i=>statusOf(i)==='teilbezahlt').length}</div><div class="hint">Teilbezahlt</div></div>
    </div>
    ${open.length?`<div style="margin-top:6px">${open.sort((a,b)=>a.dueDate<b.dueDate?-1:1).slice(0,5).map(i=>docRow(i,'invoice')).join('')}</div>`:'<div class="empty">Alles bezahlt. Sauber.</div>'}

  </div>

  <div class="card"><div class="lbl">Top-Kunden ${y}</div>${topCustomers(y)}</div>

}
function setReserve(){const v=prompt('Steuerrücklage in % vom Gewinn:',db.settings.tax.reserveRate);
  if(v!==null){db.settings.tax.reserveRate=Math.max(0,Math.min(60,+v||0));save();render();}}
function barChart(labels,a,b){
  const max=Math.max(1,...a,...b),W=100,n=labels.length,gw=W/n;
  return `<svg class="chart" viewBox="0 0 100 46" preserveAspectRatio="none" style="margin-top:14px">
   ${[0,.5,1].map(t=>`<line x1="0" x2="100" y1="${38-38*t}" y2="${38-38*t}" stroke="#28362d" stroke-width=".3"/>`).join('')}
   ${labels.map((l,i)=>{
     const h1=a[i]/max*36,h2=b[i]/max*36,x=i*gw;
     return `<rect x="${x+gw*0.16}" y="${38-h1}" width="${gw*0.3}" height="${h1}" fill="#5ecb84" rx=".6"/>
             <rect x="${x+gw*0.52}" y="${38-h2}" width="${gw*0.3}" height="${h2}" fill="#e0a458" rx=".6"/>
             <text x="${x+gw/2}" y="44" font-size="3.4" fill="#8ba396" text-anchor="middle" font-family="Inter">${l}</text>`;}).join('')}
  </svg>`;
}
function topCustomers(y){
  const m={};db.invoices.forEach(i=>{const p=sum((i.payments||[]).filter(p=>p.date.slice(0,4)==String(y)),p=>+p.amount||0);
    if(p)m[i.customerId]=(m[i.customerId]||0)+p;});
  const a=Object.entries(m).sort((x,z)=>z[1]-x[1]).slice(0,5);
  if(!a.length)return'<div class="empty">Noch keine Zahlungseingänge.</div>';
  const mx=a[0][1];
  return a.map(([id,v])=>`<div style="padding:7px 0">
    <div class="row between"><span>${esc(cust(id).name)}</span><b class="mono">${eur(v)}</b></div>
    <div class="bar" style="margin-top:5px"><i style="width:${v/mx*100}%"></i></div></div>`).join('');
}
function catBreakdown(y){
  const m={};db.expenses.filter(e=>e.date.slice(0,4)==String(y)).forEach(e=>m[e.category]=(m[e.category]||0)+(+e.amount||0));
  const afa=afaTotal(y);if(afa)m['Abschreibungen (AfA)']=afa;
  const a=Object.entries(m).sort((x,z)=>z[1]-x[1]);
  if(!a.length)return'<div class="empty">Noch keine Ausgaben erfasst.</div>';
  const t=sum(a,x=>x[1]);
  return a.map(([c,v])=>`<div class="kv"><span>${esc(c)} <span class="hint">${Math.round(v/t*100)}%</span></span><b class="mono">${eur(v)}</b></div>`).join('');
}

function numberGaps(){
  const p=db.settings.numbers.invPrefix;
  const ns=db.invoices.filter(i=>!i.draft&&i.number.startsWith(p)).map(i=>+i.number.slice(p.length)).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  const g=[];for(let i=1;i<ns.length;i++)for(let k=ns[i-1]+1;k<ns[i];k++)g.push(p+k);
  return g.slice(0,12);
}

function addPos(){cur.positions.push({desc:'',qty:1,unit:'Stk',price:0});drawEditor();}
function addFromCatalog(id){if(!id)return;const i=db.items.find(x=>x.id===id);
  cur.positions.push({desc:i.name,qty:1,unit:i.unit,price:i.price});drawEditor();}
function pullTimes(){
  const open=db.times.filter(x=>!x.invoiceId&&x.customerId===cur.customerId);
  open.forEach(t=>{cur.positions.push({desc:(t.desc||'Gartenarbeit')+' ('+dDE(t.date)+')',qty:+t.hours||0,unit:'Std',price:+t.rate||db.settings.defaults.hourRate});
    t._pull=cur.id;});
  cur._pulledTimes=open.map(t=>t.id);drawEditor();
}
function saveDoc(draft){
  if(!cur.customerId){toast('Bitte Kunde wählen');return;}
  if(!cur.positions.length){toast('Mindestens eine Position');return;}
  cur.draft=draft;
  const arr=curType==='invoice'?db.invoices:db.offers;
  const i=arr.findIndex(d=>d.id===cur.id);
  const wasNew=cur._new;delete cur._new;
  if(cur._pulledTimes){cur._pulledTimes.forEach(id=>{const t=db.times.find(x=>x.id===id);if(t)t.invoiceId=cur.id;});delete cur._pulledTimes;}
  if(i>=0)arr[i]=cur;else arr.push(cur);
  if(wasNew&&!draft){if(curType==='invoice')db.settings.numbers.invNext++;else db.settings.numbers.offNext++;}
  save();closeSheets();render();toast(draft?'Entwurf gesichert':'Gesichert');
}

function payFull(id){const d=db.invoices.find(x=>x.id===id);

/* ---------- Serienrechnungen ---------- */
function recurringDue(){return db.invoices.filter(i=>i.recurring&&i.recurring.next<=today());}
function createRecurring(){
  const s=db.settings;let n=0;
  recurringDue().forEach(src=>{
    const inv={...structuredClone(src),id:uid(),number:s.numbers.invPrefix+s.numbers.invNext,date:today(),
      deliveryDate:today(),dueDate:addDays(today(),s.defaults.paymentDays),payments:[],draft:false,recurring:null};
    db.invoices.push(inv);s.numbers.invNext++;n++;
    const step={monat:30,quartal:91,jahr:365}[src.recurring.every];
    src.recurring.next=addDays(src.recurring.next,step);
  });
  save();render();toast(n+' Rechnung(en) erstellt');
}

/* ---------- E-Mail ---------- */
function anredeOf(c){
  const last=(c.name||'').trim().split(/\s+/).pop();
  if(c.anrede==='Herr')return 'Sehr geehrter Herr '+last+',';
  if(c.anrede==='Frau')return 'Sehr geehrte Frau '+last+',';
  return 'Sehr geehrte Damen und Herren,';
}
function fillTpl(s,d,type){
  const c=cust(d.customerId),co=db.settings.company,t=totals(d);
  const pos=d.positions.map(p=>`• ${p.desc}: ${nf.format(p.qty)} ${p.unit} × ${eur(p.price)} = ${eur(p.qty*p.price)}`).join('\n');
  return s.replace(/{(\w+)}/g,(m,k)=>({
    anrede:anredeOf(c),
    nummer:d.number,datum:dDE(d.date),betrag:eur(t.gross),offen:eur(t.gross-paid(d)),faellig:dDE(d.dueDate),
    kunde:c.name,firma:co.name,inhaber:co.owner,iban:co.iban,bic:co.bic,telefon:co.phone,email:co.email,
    positionen:pos,leistungsdatum:dDE(d.deliveryDate)
  }[k]??m));
}
function mailDoc(type,id,kind){
  const d=(type==='invoice'?db.invoices:db.offers).find(x=>x.id===id);
  const m=db.settings.mail,c=cust(d.customerId);
  const sub=fillTpl(kind==='inv'?m.invSubject:kind==='off'?m.offSubject:m.remSubject,d);
  const body=fillTpl(kind==='inv'?m.invBody:kind==='off'?m.offBody:m.remBody,d);
  const kindName=kind==='rem'?'Zahlungserinnerung':(type==='invoice'?'Rechnung':'Angebot');
  sheet('E-Mail',`
  <div class="card">
    <label class="f"><span>An</span><input id="m_to" value="${esc(c.email||'')}" inputmode="email"></label>
    <label class="f"><span>Betreff</span><input id="m_sub" value="${esc(sub)}"></label>
    <label class="f"><span>Text</span><textarea id="m_body" style="min-height:260px">${esc(body)}</textarea></label>
  </div>
  <button class="btn pri full" id="m_share">Senden — PDF im Anhang</button>
  <div class="hint" style="margin:8px 0">Öffnet das Teilen-Menü mit fertigem PDF. Dort <b>Mail</b> wählen — die Nachricht geht mit Anhang, Betreff und Text auf. Text ist zusätzlich in der Zwischenablage, falls Mail ihn nicht automatisch übernimmt.</div>
  <div class="grid2">
    <button class="btn" id="m_pdf">Nur PDF speichern</button>
    <button class="btn" id="m_mailto">Nur Text-Mail</button>
  </div>`);
  const q=x=>document.querySelector(x);
  q('#m_share').onclick=async()=>{
    const subject=q('#m_sub').value,text=q('#m_body').value;
    try{await navigator.clipboard.writeText(text);}catch(e){}
    const doc=await genPdf(type,id,kindName);
    if(!doc){toast('PDF-Modul nicht geladen — bitte online öffnen');return;}
    const fname=pdfName(d,c);
    const file=new File([doc.output('blob')],fname,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:subject,text:text});}catch(e){}
    }else{
      doc.save(fname);
      location.href=`mailto:${q('#m_to').value}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
      toast('PDF gespeichert — bitte in der Mail anhängen');
    }
  };
  q('#m_pdf').onclick=()=>downloadPdf(type,id,kindName);
  q('#m_mailto').onclick=()=>{
    location.href=`mailto:${q('#m_to').value}?subject=${encodeURIComponent(q('#m_sub').value)}&body=${encodeURIComponent(q('#m_body').value)}`;};
}
function editMail(){
  const m=structuredClone(db.settings.mail);

function shrink(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',q));};img.src=r.result;};r.readAsDataURL(file);});}

/* ---------- Druck / PDF ---------- */
function pdfName(d,c){return d.number.replace(/[^\w-]/g,'')+'_'+(c.name||'Kunde').replace(/[^\wäöüÄÖÜß]+/g,'_')+'.pdf';}
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
async function genPdf(type,id,kind){
  if(!window.jspdf)return null;
  const {jsPDF}=window.jspdf;
  const d=(type==='invoice'?db.invoices:db.offers).find(x=>x.id===id);
  const c=cust(d.customerId),co=db.settings.company,t=totals(d),isInv=type==='invoice';
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const L=20,R=194,W=R-L;
  const money=v=>nf.format(v)+' EUR';
  let logoImg=null;
  if(co.logo)logoImg=await loadImg(co.logo);

  const header=()=>{
    if(logoImg){
      const h=18,w=h*logoImg.width/logoImg.height;
      doc.addImage(co.logo,'JPEG',R-w,12,w,h);
    }else{
      doc.setTextColor(90,158,70);doc.setFont('helvetica','bold');doc.setFontSize(22);
      doc.text(co.name,R,22,{align:'right'});
      doc.setTextColor(125,154,114);doc.setFont('helvetica','normal');doc.setFontSize(8);
      doc.text(co.claim||'',R,27.5,{align:'right',charSpace:1.4});
    }
  };
  const footer=(page,pages)=>{
    doc.setFontSize(7);doc.setTextColor(60);
    doc.text(page+'/'+pages,R,265,{align:'right'});
    doc.setDrawColor(190);doc.setLineWidth(.15);doc.line(L,269,R,269);
    doc.setFontSize(6.6);doc.setTextColor(85);
    const cols=[
      [co.name,co.street,co.zip+' '+co.city,co.country],
      ['Tel. '+co.phone,'E-Mail '+co.email],
      ['Steuer-Nr. '+co.taxNumber,'Inhaber/-in '+co.owner],
      ['Bank '+co.bankName,'IBAN '+co.iban,'BIC '+co.bic]
    ];
    cols.forEach((cl,i)=>cl.forEach((line,k)=>doc.text(String(line||''),L+i*44,272.5+k*3)));
  };

  header();
  // Absenderzeile + Empfänger
  doc.setFontSize(6.8);doc.setTextColor(68);doc.setFont('helvetica','normal');
  doc.text(co.name+'  -  '+co.street+'  -  '+co.zip+' '+co.city,L,60);
  doc.setDrawColor(150);doc.setLineWidth(.1);doc.line(L,61.4,L+78,61.4);
  doc.setFontSize(10.5);doc.setTextColor(20);
  [c.name,c.street,(c.zip||'')+' '+(c.city||''),c.country].forEach((x,i)=>doc.text(String(x||''),L,68+i*5));

  // Meta-Block rechts
  const MX=122;
  doc.setFont('helvetica','bold');doc.setFontSize(12);
  doc.text(isInv?'Rechnungs-Nr.':'Angebots-Nr.',MX,62);doc.text(d.number,R,62,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(45);
  const meta=[
    [isInv?'Rechnungsdatum':'Angebotsdatum',dDE(d.date)],
    [isInv?'Lieferdatum':'Gültig bis',dDE(isInv?d.deliveryDate:d.dueDate)],
    null,
    ['Ihre Kundennummer',String(c.number||'')],
    ['Ihr Ansprechpartner',co.owner]
  ];
  let my=68;
  meta.forEach(m=>{if(!m){my+=2.5;return;}doc.text(m[0],MX,my);doc.text(m[1],R,my,{align:'right'});my+=4.4;});

  // Titel + Einleitung
  doc.setTextColor(20);doc.setFont('helvetica','bold');doc.setFontSize(12.5);
  const title=kind==='Rechnung'?'Rechnungs Nr. '+d.number:kind+' Nr. '+d.number;
  doc.text(title,L,102);
  const mahnText=kind==='Zahlungserinnerung'
    ? 'sicher ist es Ihrer Aufmerksamkeit entgangen: die unten aufgeführte Rechnung ist seit dem '+dDE(d.dueDate)+' fällig und noch offen.\nBitte überweisen Sie den Betrag in den nächsten Tagen. Sollten Sie bereits gezahlt haben, betrachten Sie dieses Schreiben als gegenstandslos.'
    : kind==='Mahnung'
    ? 'trotz meiner Zahlungserinnerung ist die unten aufgeführte Rechnung bis heute nicht ausgeglichen.\nIch fordere Sie hiermit auf, den offenen Betrag bis zum '+dDE(addDays(today(),10))+' zu begleichen.'
    : d.intro;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);
  doc.text(anredeOf(c),L,111);
  let y=118;
  doc.splitTextToSize(mahnText||'',W).forEach(line=>{doc.text(line,L,y);y+=4.6;});
  y+=4;

  // Tabelle
  const C={pos:L+1,desc:L+11,qty:126,unit:158,tot:R-1};
  const headRow=()=>{
    doc.setFillColor(239,239,239);doc.rect(L,y-4.4,W,6.6,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8.8);doc.setTextColor(20);
    doc.text('Pos.',C.pos,y);doc.text('Beschreibung',C.desc,y);
    doc.text('Menge',C.qty,y,{align:'right'});doc.text('Einzelpreis',C.unit,y,{align:'right'});doc.text('Gesamtpreis',C.tot,y,{align:'right'});
    y+=7;
  };
  headRow();
  doc.setFontSize(9.3);
  d.positions.forEach((p1,i)=>{
    const lines=doc.splitTextToSize(p1.desc||'',66);
    const rh=Math.max(1,lines.length)*4.3+3.4;
    if(y+rh>235){footerless_pagebreak();}
    doc.setFont('helvetica','normal');doc.setTextColor(20);
    doc.text((i+1)+'.',C.pos,y);
    doc.setFont('helvetica','bold');
    lines.forEach((ln,k)=>doc.text(ln,C.desc,y+k*4.3));
    doc.setFont('helvetica','normal');
    doc.text(nf.format(p1.qty)+' '+(p1.unit||''),C.qty,y,{align:'right'});
    doc.text(money(p1.price),C.unit,y,{align:'right'});
    doc.text(money(p1.qty*p1.price),C.tot,y,{align:'right'});
    y+=rh;
  });
  function footerless_pagebreak(){doc.addPage();header();y=45;headRow();doc.setFontSize(9.3);}
  if(y>225)footerless_pagebreak();
  // Summen
  y+=1;
  const sumRow=(label,val,bold)=>{
    doc.setFillColor(239,239,239);doc.rect(L,y-4.2,W,6.4,'F');
    doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(9.3);
    doc.text(label,C.desc,y);doc.text(val,C.tot,y,{align:'right'});y+=7;
  };
  sumRow('Gesamtbetrag netto',money(t.net),false);
  if(d.klein){doc.setFont('helvetica','normal');doc.text('Umsatzsteuer nicht erhoben gemäß §19UStG.',C.desc,y);y+=6;}
  else sumRow('zzgl. '+d.vat+'% Umsatzsteuer',money(t.vat),false);
  sumRow('Gesamtbetrag brutto',money(t.gross),true);
  if(isInv&&paid(d)>0)sumRow('Noch offen',money(t.gross-paid(d)),true);

  // Zahlungstext
  y+=6;
  const openAmt=t.gross-paid(d);
  const payLines=isInv
    ? ['Zahlungsbedingungen: Zahlung innerhalb von '+db.settings.defaults.paymentDays+' Tagen ab Rechnungseingang ohne Abzüge.','',
       'Bitte überweisen Sie den Rechnungsbetrag unter Angabe der Rechnungsnummer auf das unten angegebene Konto.',
       'Der Rechnungsbetrag ist bis zum '+dDE(kind==='Rechnung'?d.dueDate:addDays(today(),10))+' fällig.']
    : ['Dieses Angebot ist gültig bis zum '+dDE(d.dueDate)+'. Über Ihren Auftrag freue ich mich.'];
  if(d.note)payLines.push('',...doc.splitTextToSize(d.note,W-60));
  doc.setFont('helvetica','normal');doc.setFontSize(9.3);doc.setTextColor(20);
  const textMaxW=isInv&&co.iban?W-36:W;
  let py=y;
  payLines.forEach(ln=>{doc.splitTextToSize(ln||' ',textMaxW).forEach(l2=>{doc.text(l2,L,py);py+=4.6;});});
  py+=7;
  doc.text('Mit freundlichen Grüßen',L,py);py+=5;
  doc.text(co.owner,L,py);

  // Girocode (EPC-QR) rechts neben Zahlungstext
  if(isInv&&co.iban&&window.qrcode&&openAmt>0){
    try{

const ENC=new TextEncoder();
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function le(n,v){const b=new Uint8Array(n);for(let i=0;i<n;i++)b[i]=(v>>>(8*i))&255;return b;}
function zipStore(files){
  const parts=[],cdParts=[];let off=0,cdLen=0;
  const meta=[];
  files.forEach(f=>{
    const name=ENC.encode(f.name),data=f.data,c=crc32(data);
    const h=[le(4,0x04034b50),le(2,20),le(2,0),le(2,0),le(2,0),le(2,0),le(4,c),le(4,data.length),le(4,data.length),le(2,name.length),le(2,0),name];
    const hl=h.reduce((s,x)=>s+x.length,0);
    parts.push(...h,data);meta.push({name,c,len:data.length,off});off+=hl+data.length;
  });
  meta.forEach(e=>{
    const h=[le(4,0x02014b50),le(2,20),le(2,20),le(2,0),le(2,0),le(2,0),le(2,0),le(4,e.c),le(4,e.len),le(4,e.len),
      le(2,e.name.length),le(2,0),le(2,0),le(2,0),le(2,0),le(4,0),le(4,e.off),e.name];
    cdLen+=h.reduce((s,x)=>s+x.length,0);cdParts.push(...h);
  });
  const end=[le(4,0x06054b50),le(2,0),le(2,0),le(2,meta.length),le(2,meta.length),le(4,cdLen),le(4,off),le(2,0)];
  return new Blob([...parts,...cdParts,...end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));

function sheetXml(rows){
  const body=rows.map((row,i)=>`<row r="${i+1}">`+row.map((c,j)=>{

    if(typeof c==='number')return `<c r="${ref}" s="${i===0?1:2}"><v>${c}</v></c>`;
    return `<c r="${ref}" s="${i===0?1:0}" t="inlineStr"><is><t xml:space="preserve">${xesc(c)}</t></is></c>`;

  sheets.forEach((s,i)=>add(`xl/worksheets/sheet${i+1}.xml`,sheetXml(s.rows)));

function parseCSV(txt){
  txt=txt.replace(/^\ufeff/,'');
  const delim=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r')cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

  for(const g1 of g){const i=headers.findIndex(h=>h.toLowerCase().includes(g1));if(i>=0)return i;}
  return -1;
}

    expenses:[['date','Datum *'],['desc','Beschreibung *'],['amount','Betrag *'],['vendor','Lieferant'],['category','Kategorie']]

    ${fields.map(f=>sel(f[0],f[1])).join('')}

    <button class="btn pri full" style="margin-top:10px" onclick="runImport()">Importieren</button>
  </div>
  <div class="card"><div class="lbl">Vorschau erste Zeile</div>

}
function pickDate(v){
  v=String(v||'').trim();if(!v)return today();
  let m=v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  return today();
}
function runImport(){
  const {rows,target}=IMP,h=rows[0],data=rows.slice(1);
  const gv=(r,k)=>{const i=+document.querySelector('#mp_'+k)?.value;return i>=0?(r[i]||'').trim():'';};
  const s=db.settings;let n=0;
  const findOrCreateCustomer=nm=>{
    if(!nm)return db.customers[0]?.id||'';
    let c=db.customers.find(x=>x.name.toLowerCase()===nm.toLowerCase());
    if(!c){c={id:uid(),number:s.numbers.custNext++,name:nm,street:'',zip:'',city:'',country:'Deutschland',email:'',phone:'',notes:''};db.customers.push(c);}
    return c.id;};
  if(target==='customers'){
    data.forEach(r=>{const nm=gv(r,'name');if(!nm)return;
      if(db.customers.some(c=>c.name.toLowerCase()===nm.toLowerCase()))return;
      db.customers.push({id:uid(),name:nm,street:gv(r,'street'),zip:gv(r,'zip'),city:gv(r,'city'),country:'Deutschland',
        email:gv(r,'email'),phone:gv(r,'phone'),number:gv(r,'number')||s.numbers.custNext++,notes:''});n++;});
  }
  else if(target==='expenses'){
    data.forEach(r=>{const d=gv(r,'desc'),a=num(gv(r,'amount'));if(!a)return;
      db.expenses.push({id:uid(),date:pickDate(gv(r,'date')),desc:d||'Beleg',amount:Math.abs(a),
        vendor:gv(r,'vendor'),category:CATS.find(c=>c.toLowerCase().includes(gv(r,'category').toLowerCase().slice(0,6)))||'Sonstiges',km:0,receipt:''});n++;});
  }
  else{
    const groups={};
    data.forEach(r=>{const no=gv(r,'invNumber')||'IMP-'+uid();(groups[no]=groups[no]||[]).push(r);});
    Object.entries(groups).forEach(([no,rs])=>{
      if(db.invoices.some(i=>i.number===no))return;
      const r0=rs[0],cid=findOrCreateCustomer(gv(r0,'name'));
      const date=pickDate(gv(r0,'date'));
      const positions=rs.map(r=>{
        const qty=num(gv(r,'qty'))||1,price=num(gv(r,'price')),tot=num(gv(r,'amount'));
        return {desc:gv(r,'desc')||'Leistung laut Rechnung '+no,qty,unit:'Stk',price:price||(qty?tot/qty:tot)};
      }).filter(p=>p.price||p.qty);
      if(!positions.length)positions.push({desc:'Übernahme aus sevdesk',qty:1,unit:'Stk',price:num(gv(r0,'amount'))});
      const inv={id:uid(),number:no,customerId:cid,date,deliveryDate:pickDate(gv(r0,'delivery'))||date,
        dueDate:gv(r0,'due')?pickDate(gv(r0,'due')):addDays(date,s.defaults.paymentDays),
        positions,payments:[],draft:false,klein:s.defaults.klein,vat:s.defaults.vat,intro:s.defaults.introInv,note:'',imported:true};
      const pd=gv(r0,'paidDate'),st=gv(r0,'status').toLowerCase();
      if(pd||st.includes('bezahlt')||st.includes('paid'))
        inv.payments.push({date:pd?pickDate(pd):inv.dueDate,amount:+totals(inv).gross.toFixed(2)});
      db.invoices.push(inv);n++;
      const numPart=+no.replace(/\D/g,'');
      if(no.startsWith(s.numbers.invPrefix)&&numPart>=s.numbers.invNext)s.numbers.invNext=numPart+1;
    });
  }
  save();closeSheets();render();toast(n+' Datensätze importiert');
}

/* ===================== Kassenbuch-Brücke ===================== */
function findArrays(obj,path='',out=[],depth=0){
  if(depth>4||!obj||typeof obj!=='object')return out;
  if(Array.isArray(obj)){if(obj.length&&typeof obj[0]==='object')out.push({path,len:obj.length,keys:Object.keys(obj[0])});return out;}
  Object.entries(obj).forEach(([k,v])=>findArrays(v,path?path+'.'+k:k,out,depth+1));
  return out;
}
const getPath=(o,p)=>p?p.split('.').reduce((a,k)=>a?.[k],o):o;

      <label class="f"><span>Wert für „Einnahme"</span><input id="b_typeval" value="${esc(b.typeValue)}" placeholder="z. B. income / einnahme"></label>
      <label class="f"><span>Kategorie im Kassenbuch</span><input id="b_cat" value="${esc(b.category)}"></label>
      <label class="f"><span>Text ({monat} wird ersetzt)</span><input id="b_text" value="${esc(b.text)}"></label>
      <div class="hint">Beispiel-Eintrag aus dem Kassenbuch: <code>${esc(JSON.stringify(arr[0]||{}).slice(0,180))}</code></div>
    </div>
    <div class="card"><div class="lbl">Monat übertragen</div>
      <table class="mini"><tr><th>Monat</th><th class="n">Einnahmen</th><th class="n">Ausgaben</th><th class="n">Überschuss</th><th></th></tr>
      ${MONTHS.map((m,i)=>{const ein=incomeIn(y,i+1),aus=expenseIn(y,i+1),ov=ein-aus;
        const tag=y+'-'+String(i+1).padStart(2,'0');const done=b.done.includes(tag);
        if(!ein&&!aus)return'';
        return `<tr><td>${m}</td><td class="n">${nf.format(ein)}</td><td class="n">${nf.format(aus)}</td>
          <td class="n"><b>${nf.format(ov)}</b></td>
          <td class="n">${done?'<span class="hint">übertragen</span>':`<button class="btn sm pri" onclick="bridgeTransfer('${tag}',${ov.toFixed(2)})">→</button>`}</td></tr>`;}).join('')}

function bridgeSaveCfg(){
  const q=s=>document.querySelector(s),b=db.settings.bridge;
  b.key=q('#b_key').value;b.path=q('#b_path')?.value||'';
  b.map={date:q('#b_f_date').value,amount:q('#b_f_amount').value,text:q('#b_f_text').value,
    category:q('#b_f_category').value,type:q('#b_f_type').value};
  b.typeValue=q('#b_typeval').value;b.category=q('#b_cat').value;b.text=q('#b_text').value;
  save();toast('Zuordnung gemerkt');
}
function bridgeTransfer(tag,amount){
  bridgeSaveCfg();
  const b=db.settings.bridge;
  if(!b.key||!b.map.date||!b.map.amount){toast('Bitte mindestens Datum und Betrag zuordnen');return;}
  const raw=localStorage.getItem(b.key);
  let obj;try{obj=JSON.parse(raw);}catch(e){toast('Kassenbuch nicht lesbar');return;}
  const arr=getPath(obj,b.path);
  if(!Array.isArray(arr)){toast('Buchungsliste nicht gefunden');return;}
  const m=+tag.slice(5,7),y=+tag.slice(0,4);
  const lastDay=new Date(y,m,0).getDate();
  const entry={};
  const sample=arr[0]||{};
  Object.keys(sample).forEach(k=>{entry[k]=typeof sample[k]==='number'?0:'';});
  if('id' in sample)entry.id=uid();
  entry[b.map.date]=`${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  entry[b.map.amount]=typeof sample[b.map.amount]==='string'?String(amount):+amount;
  if(b.map.text)entry[b.map.text]=b.text.replace('{monat}',MONTHS[m-1]+' '+y);
  if(b.map.category)entry[b.map.category]=b.category;
  if(b.map.type)entry[b.map.type]=b.typeValue||'einnahme';
  localStorage.setItem(b.key+'__backup_buero',raw);
  arr.push(entry);
  try{localStorage.setItem(b.key,JSON.stringify(obj));}catch(e){toast('Schreiben fehlgeschlagen');return;}
  b.done.push(tag);save();closeSheets();
  toast(MONTHS[m-1]+': '+eur(amount)+' ins Kassenbuch übertragen');
}

/* ===================== Beleg-Scan (KI) ===================== */
async function scanReceipt(dataUrl){
  try{
    const b64=dataUrl.split(',')[1];
    const headers={'Content-Type':'application/json'};
    if(db.settings.ai.key){
      headers['x-api-key']=db.settings.ai.key;
      headers['anthropic-version']='2023-06-01';
      headers['anthropic-dangerous-direct-browser-access']='true';
    }
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers,
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
        {type:'text',text:'Lies diesen Kassenbon oder diese Rechnung aus. Antworte AUSSCHLIESSLICH mit einem JSON-Objekt, ohne Markdown, ohne Erklärung:\n{"datum":"YYYY-MM-DD","betrag":Bruttogesamtbetrag als Zahl,"haendler":"Name des Händlers","beschreibung":"kurze Beschreibung des Einkaufs, max 5 Wörter","kategorie":"eine aus: '+CATS.join(', ')+'"}\nWenn ein Feld nicht erkennbar ist, lass es weg. Der Betrag ist der Endbetrag (brutto).'}
      ]}]})});
    const data=await res.json();
    const txt=(data.content||[]).map(x=>x.text||'').join('');
    const m=txt.match(/\{[\s\S]*\}/);
    if(!m)return null;
    return JSON.parse(m[0]);
  }catch(e){return null;}
}

function hasExpense(y,rx){return db.expenses.some(e=>e.date.slice(0,4)==String(y)&&rx.test((e.desc+' '+e.category+' '+(e.vendor||'')).toLowerCase()));}
function tips(){
  const y=new Date().getFullYear(),mo=new Date().getMonth()+1,mr=mrate(),t=[];
  const add=(title,body,save)=>t.push({title,body,save:save||0});
  const kmY=sum(db.expenses.filter(e=>e.date.slice(0,4)==String(y)),e=>+e.km||0);
  const profit=profitYear(y);

  // Investitions-Booster
  db.assets.filter(a=>a.type==='afa'&&degAllowed(a.date)).forEach(a=>{
    const y0=+a.date.slice(0,4);
    const diff=afaYear({...a,type:'degressiv'},y0)-afaYear(a,y0);
    if(diff>50)add('Degressive AfA für „'+a.name+'"',
      'Anschaffungen zwischen 01.07.2025 und 31.12.2027 dürfen mit 30% degressiv abgeschrieben werden statt linear. Im Kaufjahr '+eur(diff)+' mehr Abschreibung.',diff*mr);
  });
  // Sonder-AfA
  db.assets.filter(a=>!a.sonder&&['afa','degressiv'].includes(a.type)&&+a.date.slice(0,4)>=y-1).forEach(a=>{
    add('Sonderabschreibung § 7g für „'+a.name+'"',
      'Zusätzlich zur normalen AfA sind 40% der Anschaffungskosten als Sonderabschreibung möglich, verteilbar auf fünf Jahre. Voraussetzung: Gewinn im Vorjahr unter 200.000 € und mindestens 90% betriebliche Nutzung.',0.4*(+a.cost||0)*mr);
  });
  // GWG-Trick
  db.assets.filter(a=>a.cost>GWG_LIMIT&&a.cost<=1600&&a.type!=='gwg').forEach(a=>{
    add('„'+a.name+'" könnte GWG werden',
      'Mit einem vorher gebildeten Investitionsabzugsbetrag sinken die Anschaffungskosten um bis zu 50% — damit rutschen Käufe bis 1.600 € unter die 800-€-Grenze und sind sofort voll absetzbar.',0);
  });
  // IAB
  if(!db.iab.some(i=>!i.resolvedYear)&&profit>2000)
    add('Investitionsabzugsbetrag bilden',
      'Planst du in den nächsten drei Jahren eine größere Anschaffung (Anhänger, Aufsitzmäher, Transporter)? Dann darfst du 50% der geplanten Kosten schon dieses Jahr vom Gewinn abziehen. Bei 6.000 € geplanter Investition sind das 3.000 € weniger Gewinn.',3000*mr);
  db.iab.filter(i=>!i.resolvedYear&&+i.year+3<=y).forEach(i=>
    add('Frist läuft ab: IAB „'+i.name+'"',
      'Der Abzugsbetrag aus '+i.year+' muss bis Ende '+(+i.year+3)+' investiert sein, sonst wird der Gewinn rückwirkend erhöht und verzinst.',0));
  // Fahrten
  if(kmY<800)add('Fahrten konsequent erfassen',
    'Jeder betriebliche Kilometer mit dem Privatauto bringt 0,30 € Betriebsausgabe: Fahrten zum Kunden, zum Baumarkt, zur Grüngutdeponie, zur Bank. 3.000 km im Jahr sind 900 € Abzug. Bisher erfasst: '+kmY+' km.',Math.max(0,(3000-kmY)*0.3*mr));
  // Homeoffice
  const hoD=db.settings.tax.homeoffice[y]||0;
  if(hoD*6<1260)add('Homeoffice-Tagespauschale',
    'Für Tage, an denen du überwiegend zu Hause fürs Gewerbe arbeitest (Angebote schreiben, Buchhaltung, Planung), gibt es 6 € pro Tag, maximal 1.260 € im Jahr. Bisher gezählt: '+hoD+' Tage = '+eur(hoD*6)+'. Der Höchstbetrag gilt für alle Tätigkeiten zusammen.',(1260-hoD*6)*mr*0.5);
  // Telefon
  if(!hasExpense(y,/telefon|handy|mobil|internet|dsl/))add('Telefon und Internet anteilig',
    'Der betrieblich genutzte Anteil deines Handy- und Internetvertrags ist Betriebsausgabe. Ohne Einzelnachweis werden üblicherweise 20% anerkannt, maximal 20 € im Monat — 240 € im Jahr.',240*mr);
  // Arbeitskleidung
  if(!hasExpense(y,/kleidung|schuhe|schutz|handschuh/))add('Schutzkleidung und Ausrüstung',
    'Sicherheitsschuhe, Schnittschutzhose, Gehörschutz, Arbeitshandschuhe, auch die Reinigung: alles voll absetzbar, weil es typische Berufskleidung ist. Normale Kleidung dagegen nicht.',0);
  // Fortbildung
  if(!hasExpense(y,/schulung|fortbild|kurs|seminar|fachbuch|literatur/))add('Fortbildung und Fachliteratur',
    'Motorsägenkurs, Pflanzenschutz-Sachkunde, Fachbücher, Software-Abos: Betriebsausgabe. Der Sachkundenachweis ist bei Pflanzenschutz ohnehin Pflicht.',0);
  // Versicherung / SVLFG
  if(!hasExpense(y,/versicher|haftpflicht|berufsgenossen|svlfg/))add('Versicherungen und Berufsgenossenschaft',
    'Betriebshaftpflicht ist bei Gartenarbeit auf fremden Grundstücken das Wichtigste überhaupt — ein umgesägter Ast im Wintergarten kostet mehr als jede Prämie. Beiträge sind voll absetzbar. Prüf außerdem, ob dein Betrieb bei der SVLFG anmeldepflichtig ist: der Garten- und Landschaftsbau fällt dort grundsätzlich hinein, auch als Kleingewerbe.',0);
  // Konto
  if(!hasExpense(y,/konto|bank|gebühr/))add('Getrenntes Geschäftskonto',
    'Kontoführungsgebühren des Geschäftskontos sind absetzbar — wichtiger noch: ein eigenes Konto trennt privat und betrieblich sauber und macht die Prüfung im Zweifel harmlos.',0);
  // Belege ohne Foto
  const noRec=db.expenses.filter(e=>e.date.slice(0,4)==String(y)&&!e.receipt);
  if(noRec.length)add(noRec.length+(noRec.length===1?' Ausgabe':' Ausgaben')+' ohne Beleg',
    'Ohne Beleg kann das Finanzamt die Ausgabe streichen. Summe im Risiko: '+eur(sum(noRec,e=>+e.amount||0))+'. Beleg einfach nachfotografieren.',0);
  // Jahresende
  if(mo>=10)add('Jahresende steuern',
    'Bei der EÜR zählt der Zahlungszeitpunkt. Erwartest du dieses Jahr einen hohen Gewinn, zieh Anschaffungen und Material in den Dezember vor und stell Rechnungen erst Anfang Januar. Achtung bei regelmäßig wiederkehrenden Zahlungen rund um den Jahreswechsel — da gilt eine 10-Tage-Regel.',0);
  // Verlust
  if(profit<0)add('Verlust senkt deine Lohnsteuer',
    'Der Verlust aus dem Gewerbe wird mit deinem Gehalt verrechnet — das gibt Geld über die Steuererklärung zurück, rund '+eur(-profit*mr)+'. Aber: mehrere Verlustjahre hintereinander und das Finanzamt prüft Liebhaberei und erkennt gar nichts mehr an.',-profit*mr);
  // Vorauszahlung
  const prev=profitYear(y-1);
  if(prev>0&&profit>prev*1.5)add('Vorauszahlungen im Blick behalten',
    'Dein Gewinn liegt deutlich über dem Vorjahr. Das Finanzamt setzt Vorauszahlungen rückwirkend fest — leg die Rücklage jetzt beiseite, sonst kommen Nachzahlung und Vorauszahlung im selben Quartal.',0);
  // Kleinunternehmer-Verzicht
  const bigPlan=Math.max(0,...db.iab.filter(i=>!i.resolvedYear).map(i=>+i.cost||0),...db.assets.filter(a=>+a.date.slice(0,4)===y).map(a=>+a.cost||0));
  if(bigPlan>4000)add('Bei großer Investition: §19 prüfen',
    'Als Kleinunternehmer bekommst du keine Vorsteuer zurück. Bei '+eur(bigPlan)+' Investition wären das rund '+eur(bigPlan*0.19/1.19)+'. Der Verzicht auf §19 bindet dich aber fünf Jahre und verteuert dich für Privatkunden um 19%. Nur rechnen, wenn die Investition wirklich groß ist.',0);
  // Privat, aber relevant
  add('Kinderbetreuung in der Steuererklärung',
    'Kita- und Betreuungskosten sind seit 2025 zu 80% als Sonderausgaben absetzbar, bis 4.800 € je Kind. Das ist privat, nicht betrieblich — geht aber im gleichen Formular unter.',0);
  add('Geschenke und Bewirtung',
    'Kundengeschenke bis 50 € pro Person und Jahr sind absetzbar, wenn du sie getrennt aufzeichnest. Bewirtung von Geschäftspartnern zu 70%, mit maschinellem Bewirtungsbeleg.',0);
  // Backup
  const lb=db.settings.tax.lastBackup;
  if(!lb||(new Date()-new Date(lb))/864e5>30)add('Backup ist überfällig',
    'Deine Buchhaltung liegt nur auf diesem Gerät. '+(lb?'Letzte Sicherung: '+dDE(lb)+'.':'Noch nie gesichert.')+' Aufbewahrungspflicht für Buchungsbelege sind acht Jahre.',0);
  return t.sort((a,b)=>b.save-a.save);
}
function openTax(){
  const y=new Date().getFullYear(),list=tips(),mr=mrate();
  const totalSave=sum(list,t=>t.save);
  sheet('Steuer sparen',`
  <div class="card">
    <div class="lbl">Dein Grenzsteuersatz</div>
    <div class="row" style="margin-top:8px">
      <input type="range" min="20" max="48" value="${db.settings.tax.marginalRate}" oninput="db.settings.tax.marginalRate=+this.value;this.nextElementSibling.textContent=this.value+'%'" onchange="save();closeSheets();openTax()">
      <b class="amt mono" style="min-width:56px;text-align:right">${db.settings.tax.marginalRate}%</b>
    </div>
    <div class="hint" style="margin-top:6px">Der Gewinn kommt oben auf dein Gehalt drauf, wird also mit deinem höchsten Satz besteuert. Richtwert inklusive Kirchensteuer: bei rund 45.000 € zu versteuerndem Einkommen etwa 35–38%, ab 60.000 € etwa 42–45%. Jeder Euro Betriebsausgabe spart dir also grob ${Math.round(mr*100)} Cent.</div>
  </div>
  ${totalSave>50?`<div class="card" style="border-color:#2f7a4c"><div class="lbl">Ungenutztes Potenzial</div>
    <div class="big mono" style="color:var(--moss)">${eur(totalSave)}</div>
    <div class="hint">Grobe Schätzung aus den Hinweisen unten, die sich beziffern lassen.</div></div>`:''}
  ${list.map(t=>`<div class="card">
    <div class="row between"><b>${esc(t.title)}</b>${t.save>1?`<span class="amt mono" style="color:var(--moss)">${eur(t.save)}</span>`:''}</div>
    <div class="hint" style="margin-top:6px">${esc(t.body)}</div></div>`).join('')}
  <div class="card">
    <div class="lbl">Homeoffice-Tage ${y}</div>
    <div class="row between" style="margin-top:8px">
      <button class="btn" onclick="hoDay(-1)">−</button>
      <div style="text-align:center"><div class="big mono">${db.settings.tax.homeoffice[y]||0}</div><div class="hint">= ${eur(homeofficeSum(y))}</div></div>
      <button class="btn pri" onclick="hoDay(1)">+ Tag</button>
    </div>
  </div>
  <div class="grid2">
    <button class="btn" onclick="openIAB()">Investitionsabzug</button>
    <button class="btn" onclick="openChecklist()">Jahresend-Checkliste</button>
  </div>
  <div class="hint" style="margin-top:12px">Das sind Hinweise, keine Steuerberatung. Die Berechnungen sind vereinfacht — bevor du etwas davon in der Erklärung ansetzt, kurz mit deinem Steuerberater gegenchecken.</div>`);
}
function hoDay(d){const y=new Date().getFullYear();const h=db.settings.tax.homeoffice;
  h[y]=Math.max(0,Math.min(210,(h[y]||0)+d));save();closeSheets();openTax();}

function openIAB(){
  const y=new Date().getFullYear();
  sheet('Investitionsabzugsbetrag',`
  <div class="info">Bis zu 50% der voraussichtlichen Kosten einer geplanten Anschaffung darfst du schon heute vom Gewinn abziehen — die Steuerersparnis kommt also, bevor du das Geld ausgibst. Bedingungen: Gewinn unter 200.000 €, mindestens 90% betriebliche Nutzung, und die Investition muss innerhalb von drei Jahren kommen. Sonst wird der Abzug rückwirkend gestrichen und verzinst.</div>
  <div class="card">
    ${db.iab.length?db.iab.map(i=>`<div class="item" onclick="editIAB('${i.id}')">
      <div class="g"><div class="nm">${esc(i.name)}</div>
      <div class="mt">gebildet ${i.year} · Frist ${+i.year+3} · geplant ${i.plannedYear}${i.resolvedYear?' · aufgelöst '+i.resolvedYear:''}</div></div>
      <div style="text-align:right"><div class="amt mono">${eur(i.amount)}</div><div class="hint">von ${eur(i.cost)}</div></div></div>`).join('')
      :'<div class="empty">Noch kein Investitionsabzug gebildet.</div>'}
    <button class="btn full pri" style="margin-top:10px" onclick="editIAB()">Geplante Investition erfassen</button>
  </div>
  <div class="card"><div class="lbl">Wirkung ${y}</div>
    <div class="kv"><span>Abzug vom Gewinn</span><b class="mono">${eur(iabYear(y))}</b></div>
    <div class="kv"><span>Steuerersparnis ca.</span><b class="mono">${eur(iabYear(y)*mrate())}</b></div>
  </div>`);
}
function editIAB(id){
  const y=new Date().getFullYear();
  const i=id?structuredClone(db.iab.find(x=>x.id===id)):{id:uid(),name:'',cost:0,amount:0,year:y,plannedYear:y+1,resolvedYear:''};
  const el=sheet(id?'Investitionsabzug':'Neue geplante Investition',`<div class="card">
    <label class="f"><span>Was soll gekauft werden?</span><input id="k_name" value="${esc(i.name)}" placeholder="z. B. Anhänger mit Auffahrrampe"></label>
    <div class="grid2">
      <label class="f"><span>Voraussichtliche Kosten netto €</span><input id="k_cost" type="number" step="0.01" inputmode="decimal" value="${i.cost}"></label>
      <label class="f"><span>Abzug (max. 50%)</span><input id="k_amount" type="number" step="0.01" inputmode="decimal" value="${i.amount}"></label>
    </div>
    <div class="grid2">
      <label class="f"><span>Jahr der Bildung</span><input id="k_year" type="number" inputmode="numeric" value="${i.year}"></label>
      <label class="f"><span>Geplantes Kaufjahr</span><input id="k_plan" type="number" inputmode="numeric" value="${i.plannedYear}"></label>
    </div>
    <label class="f"><span>Aufgelöst im Jahr (nach dem Kauf eintragen)</span><input id="k_res" type="number" inputmode="numeric" value="${i.resolvedYear||''}" placeholder="leer = noch offen"></label>
    <div id="k_prev" class="hint"></div>
  </div>
  <button class="btn pri full" id="k_save">Sichern</button>
  ${id?`<button class="btn full dan" style="margin-top:8px" onclick="delIAB('${id}')">Löschen</button>`:''}`);
  const g=s=>el.querySelector(s);
  const prev=()=>{const c=num(g('#k_cost').value);
    if(c&&!num(g('#k_amount').value))g('#k_amount').value=(c*0.5).toFixed(2);
    const a=num(g('#k_amount').value);
    g('#k_prev').textContent=a?`Senkt den Gewinn ${g('#k_year').value} um ${eur(a)} — rund ${eur(a*mrate())} weniger Steuer. Im Kaufjahr wird der Betrag wieder aufgeschlagen, dafür sinken die Anschaffungskosten um denselben Betrag.`:'';};
  ['#k_cost','#k_amount','#k_year'].forEach(x=>{g(x).oninput=prev;});prev();
  g('#k_save').onclick=()=>{
    i.name=g('#k_name').value;i.cost=num(g('#k_cost').value);i.amount=Math.min(num(g('#k_amount').value),i.cost*0.5);
    i.year=+g('#k_year').value;i.plannedYear=+g('#k_plan').value;i.resolvedYear=g('#k_res').value?+g('#k_res').value:'';
    if(!i.name||!i.amount){toast('Bezeichnung und Betrag nötig');return;}
    const k=db.iab.findIndex(x=>x.id===i.id);if(k>=0)db.iab[k]=i;else db.iab.push(i);
    save();closeSheets();render();toast('Gesichert');};
}
function delIAB(id){db.iab.splice(db.iab.findIndex(i=>i.id===id),1);save();closeSheets();render();}

const CHECK=[
 'Alle Belege des Jahres fotografiert und erfasst',
 'Kontoauszüge Dezember mit den Rechnungen abgeglichen',
 'Offene Rechnungen gemahnt oder abgeschrieben',
 'Anlagenverzeichnis aktuell, GWG ab 250 € einzeln aufgezeichnet',
 'Betriebliche Fahrten vollständig erfasst',
 'Homeoffice-Tage gezählt',
 'Investitionsabzug geprüft: lohnt sich einer für nächstes Jahr?',
 'Anschaffungen bewusst ins alte oder neue Jahr gelegt',
 'Degressive AfA geprüft (gilt nur noch bis 31.12.2027)',
 'Excel-Auswertung erzeugt und an den Steuerberater geschickt',
 'Backup gesichert und an einen zweiten Ort kopiert',
 'Alte Belege aussortiert: Buchungsbelege müssen 8 Jahre bleiben'
];
function openChecklist(){
  const y=new Date().getFullYear(),c=db.settings.tax.checklist[y]=db.settings.tax.checklist[y]||{};
  const done=CHECK.filter((_,i)=>c[i]).length;
  sheet('Jahresend-Checkliste '+y,`
  <div class="card tight"><div class="row between"><span class="lbl">Erledigt</span><span class="amt mono">${done}/${CHECK.length}</span></div>
    <div class="bar" style="margin-top:8px"><i style="width:${done/CHECK.length*100}%"></i></div></div>
  <div class="card">${CHECK.map((x,i)=>`<label class="row" style="gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">
    <input type="checkbox" style="width:auto" ${c[i]?'checked':''} onchange="db.settings.tax.checklist[${y}][${i}]=this.checked;save()">
    <span style="flex:1;${c[i]?'color:var(--dim);text-decoration:line-through':''}">${esc(x)}</span></label>`).join('')}</div>`);
}

/* ---------- Start ---------- */
document.getElementById('hlogo').textContent=(db.settings.company.name||'G')[0];
drawTabs();render();
window.addEventListener('beforeunload',save);
</script>
</body>
</html>
